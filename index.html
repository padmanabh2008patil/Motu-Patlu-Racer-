
<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#100b08">
<title>Race Ka Raja: Rocket Buggy Racer</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #100b08;
  font-family: Arial, sans-serif;
}

#game {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  height: 100dvh;
  overflow: hidden;
  background: #100b08;
}

.screen {
  position: absolute;
  inset: 0;
  display: none;
  overflow: hidden;
}

.screen.active {
  display: block;
}

.bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: fill;
}

.hit {
  position: absolute;
  z-index: 3;
  border: 0;
  padding: 0;
  background: transparent;
  touch-action: manipulation;
}

#progressTrack {
  position: absolute;
  left: 20.7%;
  top: 78.2%;
  width: 58.5%;
  height: 5.8%;
  overflow: hidden;
  border: 3px solid #ffbd25;
  border-radius: 999px;
  background: #351000;
}

#progress {
  width: 0%;
  height: 100%;
  background: repeating-linear-gradient(
    45deg, #ff5b00 0 10px, #ff9a00 10px 20px
  );
}

#loadPercent {
  position: absolute;
  top: 86%;
  width: 100%;
  text-align: center;
  color: white;
  font-size: clamp(12px, 2vw, 24px);
  font-weight: bold;
  text-shadow: 2px 3px 3px black;
}

.backBtn {
  position: absolute;
  z-index: 5;
  left: 1.5%;
  top: 2%;
  width: 10%;
  height: 13%;
  min-width: 55px;
  border: 3px solid #ffca36;
  border-radius: 15px;
  background: linear-gradient(#ffb52a, #f15a00);
  color: white;
  font-weight: bold;
}

#itemLabel {
  position: absolute;
  z-index: 4;
  left: 50%;
  top: 3%;
  transform: translateX(-50%);
  padding: 8px 16px;
  border: 2px solid #ffca36;
  border-radius: 12px;
  background: #351000dd;
  color: #ffcf27;
  font-weight: bold;
  font-size: clamp(14px, 2.5vw, 30px);
  white-space: nowrap;
  text-align: center;
}

#notice {
  position: absolute;
  z-index: 20;
  left: 50%;
  bottom: 2%;
  transform: translateX(-50%);
  max-width: 90%;
  padding: 8px 14px;
  border: 2px solid #ffc22c;
  border-radius: 10px;
  background: #190700f2;
  color: white;
  font-size: clamp(12px, 1.5vw, 18px);
  text-align: center;
  display: none;
}

#rotateMessage {
  display: none;
  position: absolute;
  inset: 0;
  z-index: 100;
  background: #180900;
  color: white;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 10%;
  font-size: 22px;
}

@media (orientation: portrait) {
  #rotateMessage { display: flex; }
}
</style>
</head>

<body>
<div id="game">

<div id="rotateMessage">
  कृपया मोबाईल आडवा (Landscape) फिरवा.
</div>

<!-- 1. LOADING -->
<section id="loading" class="screen active">
  <img class="bg" src="images/loading.png" alt="Loading">
  <div id="progressTrack"><div id="progress"></div></div>
  <div id="loadPercent">Loading 0%</div>
</section>

<!-- 2. HOME -->
<section id="home" class="screen">
  <img class="bg" src="images/home.png" alt="Home">

  <button class="hit" aria-label="Play"
    style="left:72%;top:62%;width:25%;height:34%"
    onclick="go('adventure')"></button>
</section>

<!-- 3. ADVENTURE -->
<section id="adventure" class="screen">
  <img class="bg" src="images/adventure.png" alt="Adventure">

  <button class="hit" aria-label="Back"
    style="left:0;top:0;width:10%;height:18%"
    onclick="go('home')"></button>

  <button class="hit" aria-label="Continue"
    style="left:35%;top:60%;width:30%;height:36%"
    onclick="go('series')"></button>
</section>

<!-- 4. CHOOSE SERIES -->
<section id="series" class="screen">
  <img class="bg" src="images/series.png" alt="Choose Series">

  <button class="hit" aria-label="Back"
    style="left:0;top:0;width:12%;height:20%"
    onclick="go('adventure')"></button>

  <!-- Series निवडण्याच्या जागेवर टॅप करा -->
  <button class="hit" aria-label="Choose Series"
    style="left:15%;top:20%;width:70%;height:75%"
    onclick="go('garage')"></button>
</section>

<!-- 5. GARAGE MENU -->
<section id="garage" class="screen">
  <img class="bg" src="images/garage.png" alt="Garage">

  <button class="hit" aria-label="Back"
    style="left:0;top:0;width:10%;height:18%"
    onclick="go('series')"></button>

  <button class="hit" aria-label="Powerups"
    style="left:17%;top:69%;width:16%;height:29%"
    onclick="go('powerups')"></button>

  <button class="hit" aria-label="Switch Car"
    style="left:34%;top:69%;width:15%;height:29%"
    onclick="openCars()"></button>

  <button class="hit" aria-label="Switch Player"
    style="left:50%;top:69%;width:16%;height:29%"
    onclick="openPlayers()"></button>
</section>

<!-- 6. POWERUPS -->
<section id="powerups" class="screen">
  <img class="bg" src="images/powerups.png" alt="Powerups">

  <button class="backBtn"
    onclick="go('garage')">BACK</button>
</section>

<!-- 7. PLAYER SELECTION -->
<section id="players" class="screen">
  <img id="playerBg" class="bg"
       src="images/player1.png" alt="Player">

  <button class="backBtn"
    onclick="go('garage')">BACK</button>

  <div id="itemLabel">Player 1</div>

  <button class="hit" aria-label="Previous Player"
    style="left:0;top:35%;width:15%;height:40%"
    onclick="changeItem('player',-1)"></button>

  <button class="hit" aria-label="Next Player"
    style="right:0;top:35%;width:15%;height:40%"
    onclick="changeItem('player',1)"></button>

  <button class="hit" aria-label="Select Player"
    style="left:40%;bottom:0;width:20%;height:18%"
    onclick="selectItem('player')"></button>
</section>

<!-- 8. CAR SELECTION -->
<section id="cars" class="screen">
  <img id="carBg" class="bg"
       src="images/car1.png" alt="Car">

  <button class="backBtn"
    onclick="go('garage')">BACK</button>

  <div id="carLabel" class="itemLabel"
    style="position:absolute;z-index:4;left:50%;top:3%;
    transform:translateX(-50%);padding:8px 16px;
    border:2px solid #ffca36;border-radius:12px;
    background:#351000dd;color:#ffcf27;font-weight:bold;
    font-size:clamp(14px,2.5vw,30px);white-space:nowrap">
    Car 1
  </div>

  <button class="hit" aria-label="Previous Car"
    style="left:0;top:35%;width:15%;height:40%"
    onclick="changeItem('car',-1)"></button>

  <button class="hit" aria-label="Next Car"
    style="right:0;top:35%;width:15%;height:40%"
    onclick="changeItem('car',1)"></button>

  <button class="hit" aria-label="Select Car"
    style="left:40%;bottom:0;width:20%;height:18%"
    onclick="selectItem('car')"></button>
</section>

<div id="notice" role="status"></div>
</div>

<script>
const screens = document.querySelectorAll('.screen');

function go(id) {
  screens.forEach(screen => {
    screen.classList.toggle('active', screen.id === id);
  });
  hideNotice();
}

/* LOADING */
let progress = 0;
const progressEl = document.getElementById('progress');
const percentEl = document.getElementById('loadPercent');

const loader = setInterval(() => {
  progress = Math.min(100, progress + 1);
  progressEl.style.width = progress + '%';
  percentEl.textContent = 'Loading ' + progress + '%';

  if (progress >= 100) {
    clearInterval(loader);
    setTimeout(() => go('home'), 400);
  }
}, 35);

/* PLAYER AND CAR */
let playerIndex = 0;
let carIndex = 0;

let selectedPlayer = 0;
let selectedCar = 0;

const playerNames = [
  'Player 1', 'Player 2', 'Player 3',
  'Player 4', 'Player 5', 'Player 6'
];

const carNames = [
  'Car 1', 'Car 2', 'Car 3',
  'Car 4', 'Car 5', 'Car 6'
];

function openPlayers() {
  playerIndex = selectedPlayer;
  updateItem('player');
  go('players');
}

function openCars() {
  carIndex = selectedCar;
  updateItem('car');
  go('cars');
}

function changeItem(type, direction) {
  if (type === 'player') {
    playerIndex = (playerIndex + direction + 6) % 6;
  } else {
    carIndex = (carIndex + direction + 6) % 6;
  }

  updateItem(type);
}

function updateItem(type) {
  if (type === 'player') {
    document.getElementById('playerBg').src =
      'images/player' + (playerIndex + 1) + '.png';

    document.getElementById('playerLabel').textContent =
      playerNames[playerIndex];
  } else {
    document.getElementById('carBg').src =
      'images/car' + (carIndex + 1) + '.png';

    document.getElementById('carLabel').textContent =
      carNames[carIndex];
  }
}

function selectItem(type) {
  if (type === 'player') {
    selectedPlayer = playerIndex;
    showNotice(playerNames[playerIndex] + ' निवडला!');
  } else {
    selectedCar = carIndex;
    showNotice(carNames[carIndex] + ' निवडली!');
  }

  setTimeout(() => go('garage'), 600);
}

/* NOTICE */
let noticeTimer;

function showNotice(message) {
  const notice = document.getElementById('notice');
  notice.textContent = message;
  notice.style.display = 'block';

  clearTimeout(noticeTimer);
  noticeTimer = setTimeout(hideNotice, 2200);
}

function hideNotice() {
  document.getElementById('notice').style.display = 'none';
  clearTimeout(noticeTimer);
}
</script>

</body>
</html>
