
<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#100b08">
<title>Race Ka Raja: Rocket Buggy Racer</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;padding:0;width:100%;height:100%;
 overflow:hidden;background:#100b08;
 font-family:Arial,sans-serif;
}
#game{
 position:fixed;inset:0;
 width:100vw;height:100vh;height:100dvh;
 overflow:hidden;background:#24150c;
}
.screen{position:absolute;inset:0;display:none;overflow:hidden}
.screen.active{display:block}
.bg{
 position:absolute;inset:0;width:100%;height:100%;
 object-fit:fill;
}
.hit{
 position:absolute;border:0;background:transparent;
 padding:0;touch-action:manipulation;
}
#progressTrack{
 position:absolute;left:20.7%;top:78.2%;
 width:58.5%;height:5.8%;
 border-radius:999px;overflow:hidden;
 background:#351000;border:3px solid #ffbd25;
}
#progress{
 height:100%;width:0%;
 background:repeating-linear-gradient(
  45deg,#ff5b00 0 10px,#ff9a00 10px 20px
 );
}
#loadPercent{
 position:absolute;top:86%;width:100%;
 text-align:center;color:white;font-weight:bold;
 font-size:clamp(12px,2vw,24px);
 text-shadow:2px 3px 3px black;
}
.backBtn{
 position:absolute;z-index:5;left:1.5%;top:2%;
 width:10%;height:13%;min-width:55px;
 border:3px solid #ffca36;border-radius:15px;
 background:linear-gradient(#ffb52a,#f15a00);
 color:white;font-weight:bold;
}
#playerLabel{
 position:absolute;left:50%;top:3%;
 transform:translateX(-50%);
 padding:8px 16px;border:2px solid #ffca36;
 border-radius:12px;background:#351000dd;
 color:#ffcf27;font-weight:bold;
 font-size:clamp(14px,2.5vw,30px);
 white-space:nowrap;
}
#notice{
 position:absolute;z-index:10;left:50%;bottom:2%;
 transform:translateX(-50%);max-width:90%;
 padding:8px 14px;border:2px solid #ffc22c;
 border-radius:10px;background:#190700f2;
 color:white;font-size:clamp(12px,1.3vw,18px);
 text-align:center;display:none;
}
#rotateMessage{
 display:none;position:absolute;inset:0;z-index:100;
 background:#180900;color:white;
 align-items:center;justify-content:center;
 text-align:center;padding:10%;font-size:22px;
}
@media (orientation:portrait){
 #rotateMessage{display:flex}
}
</style>
</head>

<body>
<div id="game">

<div id="rotateMessage">
 कृपया मोबाईल आडवा (Landscape) फिरवा.
</div>

<!-- 1. LOADING SCREEN -->
<section id="loading" class="screen active">
 <img class="bg"
 src="https://drive.google.com/thumbnail?id=1dtYrA_6Ib4wk6_BKCI153LcGIDQJbHlV&sz=w1600"
 alt="Loading Screen">
 <div id="progressTrack"><div id="progress"></div></div>
 <div id="loadPercent">Loading 0%</div>
</section>

<!-- 2. HOME SCREEN: NEWS, SIGN IN, PLAY -->
<section id="home" class="screen">
 <img class="bg"
 src="https://drive.google.com/thumbnail?id=1GYQjwfzY7wWeMwcMqQtNQwS0bW4h2UUK&sz=w1600"
 alt="Home Screen">

 <button class="hit" aria-label="Play"
 style="left:72%;top:62%;width:25%;height:34%"
 onclick="go('adventure')"></button>
</section>

<!-- 3. ADVENTURE SCREEN -->
<section id="adventure" class="screen">
 <img class="bg"
 src="https://drive.google.com/thumbnail?id=1sViX1L1P3gTmFeLGtwlq1qR_Xem7Hp_3&sz=w1600"
 alt="Adventure Screen">

 <button class="hit" aria-label="Back"
 style="left:0;top:0;width:10%;height:18%"
 onclick="go('home')"></button>

 <button class="hit" aria-label="Adventure"
 style="left:35%;top:60%;width:30%;height:36%"
 onclick="go('garage')"></button>
</section>

<!-- 4. SWITCH PLAYER / SWITCH CAR / POWERUPS MENU -->
<section id="garage" class="screen">
 <img class="bg"
 src="https://drive.google.com/thumbnail?id=1sViX1L1P3gTmFeLGtwlq1qR_Xem7Hp_3&sz=w1600"
 alt="Game Menu">

 <button class="hit" aria-label="Powerups"
 style="left:17%;top:69%;width:16%;height:29%"
 onclick="go('powerups')"></button>

 <button class="hit" aria-label="Switch Car"
 style="left:34%;top:69%;width:15%;height:29%"
 onclick="showNotice('Switch Car स्क्रीन पुढे जोडू.')"></button>

 <button class="hit" aria-label="Switch Player"
 style="left:50%;top:69%;width:16%;height:29%"
 onclick="go('playerScreen')"></button>
</section>

<!-- POWERUPS SCREEN -->
<section id="powerups" class="screen">
 <img class="bg"
 src="https://drive.google.com/thumbnail?id=1ykC0JKp-ELQS73P2D65ojNPZ2yykjZ4G&sz=w1600"
 alt="Powerups Screen">

 <button class="hit" aria-label="Back"
 style="left:0;top:0;width:11%;height:20%"
 onclick="go('garage')"></button>
</section>

<!-- 5. PLAYER 1 TO PLAYER 6 -->
<section id="playerScreen" class="screen">
 <img id="playerBg" class="bg"
 src="https://drive.google.com/thumbnail?id=1etvsRlyh3Sc-4BYESFtsel5H8MlHkNO4&sz=w1600"
 alt="Turbo Golu">

 <button class="backBtn"
 onclick="go('garage')">BACK</button>

 <div id="playerLabel">Player 1 — Turbo Golu</div>

 <button class="hit" aria-label="Previous Player"
 style="left:0;top:35%;width:15%;height:40%"
 onclick="changePlayer(-1)"></button>

 <button class="hit" aria-label="Next Player"
 style="right:0;top:35%;width:15%;height:40%"
 onclick="changePlayer(1)"></button>

 <button class="hit" aria-label="Select Player"
 style="left:40%;bottom:0;width:20%;height:18%"
 onclick="selectPlayer()"></button>
</section>

<div id="notice" role="status"></div>
</div>

<script>
const screens = document.querySelectorAll('.screen');

function go(id){
 screens.forEach(s => {
  s.classList.toggle('active', s.id === id);
 });
 hideNotice();
}

/* LOADING 0% TO 100% */
let progress = 0;
const progressEl = document.getElementById('progress');
const percentEl = document.getElementById('loadPercent');

const loader = setInterval(() => {
 progress = Math.min(100, progress + 1);
 progressEl.style.width = progress + '%';
 percentEl.textContent = 'Loading ' + progress + '%';

 if(progress >= 100){
  clearInterval(loader);
  setTimeout(() => go('home'), 400);
 }
}, 35);

/* SIX PLAYER SCREENS */
const players = [
 {
  name:'Turbo Golu',
  file:'https://drive.google.com/thumbnail?id=1etvsRlyh3Sc-4BYESFtsel5H8MlHkNO4&sz=w1600',
  locked:false
 },
 {
  name:'Nitro Chotu',
  file:'https://drive.google.com/thumbnail?id=19wQXN7ODSc5GrPZm3vWTIY0dRmtNSLZ7&sz=w1600',
  locked:true
 },
 {
  name:'Dr. Bubbly',
  file:'https://drive.google.com/thumbnail?id=1aYpPdXUVu9OWMILsfgKJhINUQhZYhz_-&sz=w1600',
  locked:true
 },
 {
  name:'Rinku Rocker',
  file:'https://drive.google.com/thumbnail?id=1gaMw6nr7Rne_PCJNEQYCRGi_o1JqBbwW&sz=w1600',
  locked:true
 },
 {
  name:'Mukka Max',
  file:'https://drive.google.com/thumbnail?id=1rGPQZvsfk5gdYaPZgDRxb6S9OxIQcw5A&sz=w1600',
  locked:true
 },
 {
  name:'Player 6',
  file:'https://drive.google.com/thumbnail?id=1rGPQZvsfk5gdYaPZgDRxb6S9OxIQcw5A&sz=w1600',
  locked:true
 }
];

let playerIndex = 0;

function changePlayer(direction){
 playerIndex =
  (playerIndex + direction + players.length) % players.length;

 const p = players[playerIndex];

 const img = document.getElementById('playerBg');
 img.src = p.file;
 img.alt = p.name;

 document.getElementById('playerLabel').textContent =
  'Player ' + (playerIndex + 1) + ' — ' + p.name;

 showNotice(p.name + (p.locked ? ' — LOCKED' : ''));
}

function selectPlayer(){
 const p = players[playerIndex];

 if(p.locked){
  showNotice(p.name + ' सध्या LOCKED आहे.');
 } else {
  showNotice(p.name + ' निवडला!');
  setTimeout(() => go('garage'), 700);
 }
}

/* NOTICE */
let noticeTimer;

function showNotice(message){
 const n = document.getElementById('notice');
 n.textContent = message;
 n.style.display = 'block';

 clearTimeout(noticeTimer);
 noticeTimer = setTimeout(() => {
  n.style.display = 'none';
 }, 2200);
}

function hideNotice(){
 document.getElementById('notice').style.display = 'none';
}
</script>
</body>
</html>
