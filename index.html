<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Race Ka Raja: Rocket Buggy Racer</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #100b08;
  font-family: Arial, sans-serif;
}

#game {
  position: absolute;
  width: min(100vw, 177.7778vh);
  height: min(100vh, 56.25vw);
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  overflow: hidden;
  background: #24150c;
}

.screen {
  position: absolute;
  inset: 0;
  display: none;
}

.screen.active {
  display: block;
}

.bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: fill;
}

.hit {
  position: absolute;
  border: 0;
  background: transparent;
  cursor: pointer;
  padding: 0;
  touch-action: manipulation;
}

#progressTrack {
  position: absolute;
  left: 20.7%;
  top: 78.2%;
  width: 58.5%;
  height: 5.8%;
  border-radius: 999px;
  overflow: hidden;
  background: #351000;
  border: 4px solid #ffbd25;
}

#progress {
  height: 100%;
  width: 0%;
  background: repeating-linear-gradient(
    45deg,
    #ff5b00 0 10px,
    #ff9a00 10px 20px
  );
}

#loadPercent {
  position: absolute;
  top: 86%;
  width: 100%;
  text-align: center;
  color: white;
  font-weight: bold;
  font-size: 2vw;
  text-shadow: 2px 3px 3px black;
  pointer-events: none;
}

.overlayPanel {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(12, 5, 0, 0.65);
  padding: 3%;
}

.panel {
  width: 75%;
  max-height: 86%;
  overflow: auto;
  border: 5px solid #ff8b00;
  border-radius: 22px;
  background: linear-gradient(#6b2608, #2c1006);
  color: white;
  text-align: center;
  padding: 2%;
}

.panel h1 {
  margin: 0 0 2%;
  font-size: 3vw;
  color: #ffcf27;
  text-shadow: 3px 4px 2px #260900;
}

.panel p {
  font-size: 1.5vw;
  font-weight: bold;
}

.choiceRow {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 3%;
}

.choice {
  padding: 12px 18px;
  border: 3px solid #ffc22c;
  border-radius: 12px;
  background: linear-gradient(#ffb52a, #f05b00);
  color: white;
  font-size: 1.4vw;
  font-weight: bold;
  text-shadow: 2px 2px #4d1700;
  cursor: pointer;
}

#carName {
  font-size: 2.8vw;
  color: #ffcf27;
  text-shadow: 2px 3px #2a0900;
}

#carBack {
  position: absolute;
  left: 1.2%;
  top: 2%;
  width: 8%;
  height: 14%;
  border: 3px solid #ffca36;
  border-radius: 50%;
  background: linear-gradient(#ffb52a, #f15a00);
  color: white;
  font-weight: bold;
  font-size: 1.5vw;
  cursor: pointer;
}

#notice {
  position: absolute;
  left: 50%;
  bottom: 2%;
  transform: translateX(-50%);
  max-width: 90%;
  padding: 10px 18px;
  border: 2px solid #ffc22c;
  border-radius: 12px;
  background: rgba(25, 7, 0, 0.95);
  color: white;
  font-size: 1.2vw;
  font-weight: bold;
  text-align: center;
  display: none;
}

@media (orientation: portrait) {
  #game {
    width: 100vw;
    height: 56.25vw;
  }
}
</style>
</head>

<body>
<div id="game">

  <!-- 1. LOADING SCREEN -->
  <section id="loading" class="screen active">
    <img class="bg" src="assets/loading.png"
         alt="Race Ka Raja Loading Screen">

    <div id="progressTrack">
      <div id="progress"></div>
    </div>

    <div id="loadPercent">Loading 0%</div>
  </section>

  <!-- 2. HOME SCREEN -->
  <section id="home" class="screen">
    <img class="bg" src="assets/home.png" alt="Home Screen">

    <button class="hit"
      aria-label="Play"
      style="left:75%;top:65%;width:20%;height:27%;"
      onclick="go('adventure')">
    </button>
  </section>

  <!-- 3. ADVENTURE SCREEN -->
  <section id="adventure" class="screen">
    <img class="bg" src="assets/adventure.png"
         alt="Adventure Screen">

    <button class="hit"
      aria-label="Back"
      style="left:0;top:0;width:8%;height:18%;"
      onclick="go('home')">
    </button>

    <button class="hit"
      aria-label="Adventure"
      style="left:39%;top:68%;width:23%;height:27%;"
      onclick="go('garage')">
    </button>
  </section>

  <!-- 4. MAIN GAME MENU -->
  <section id="garage" class="screen">
    <img class="bg" src="assets/garage.png"
         alt="Main Game Menu">

    <button class="hit"
      aria-label="Upgrade"
      style="left:0;top:72%;width:15%;height:25%;"
      onclick="showNotice('Upgrade स्क्रीन नंतर जोडू.')">
    </button>

    <button class="hit"
      aria-label="Powerups"
      style="left:18%;top:72%;width:14%;height:25%;"
      onclick="go('powerups')">
    </button>

    <button class="hit"
      aria-label="Switch Car"
      style="left:33%;top:72%;width:14%;height:25%;"
      onclick="go('carScreen')">
    </button>

    <button class="hit"
      aria-label="Switch Player"
      style="left:49%;top:72%;width:15%;height:25%;"
      onclick="go('playerScreen')">
    </button>

    <button class="hit"
      aria-label="Choose Series"
      style="left:75%;top:72%;width:24%;height:25%;"
      onclick="go('seriesScreen')">
    </button>
  </section>

  <!-- 5. POWERUPS SCREEN -->
  <section id="powerups" class="screen">
    <img class="bg" src="assets/powerups.png"
         alt="Powerups Screen">

    <button class="hit"
      aria-label="Back"
      style="left:0;top:0;width:9%;height:20%;"
      onclick="go('garage')">
    </button>
  </section>

  <!-- 6. PLAYER SELECTION -->
  <section id="playerScreen" class="screen">
    <img id="playerBg"
         class="bg"
         src="assets/player_1.png"
         alt="Player Selection">

    <button class="hit"
      aria-label="Back"
      style="left:0;top:0;width:8%;height:15%;"
      onclick="go('garage')">
    </button>

    <button class="hit"
      aria-label="Previous Player"
      style="left:35%;top:80%;width:9%;height:18%;"
      onclick="changePlayer(-1)">
    </button>

    <button class="hit"
      aria-label="Select Player"
      style="left:45%;top:80%;width:30%;height:18%;"
      onclick="selectPlayer()">
    </button>

    <button class="hit"
      aria-label="Next Player"
      style="left:75%;top:80%;width:10%;height:18%;"
      onclick="changePlayer(1)">
    </button>
  </section>

  <!-- 7. TEMPORARY SWITCH CAR SCREEN -->
  <section id="carScreen" class="screen">
    <img class="bg" src="assets/garage.png"
         alt="Temporary Car Selection">

    <div class="overlayPanel">
      <div class="panel">
        <h1>SWITCH CAR</h1>

        <p>
          Switch Car चे मूळ 6 फोटो नंतर जोडू.
        </p>

        <div id="carName">Raja Rocket</div>

        <div class="choiceRow">
          <button class="choice"
            onclick="changeCar(-1)">❮ मागे</button>

          <button class="choice"
            onclick="selectCar()">SELECT</button>

          <button class="choice"
            onclick="changeCar(1)">पुढे ❯</button>
        </div>
      </div>
    </div>

    <button id="carBack"
      onclick="go('garage')">BACK</button>
  </section>

  <!-- 8. TEMPORARY CHOOSE SERIES SCREEN -->
  <section id="seriesScreen" class="screen">
    <img class="bg" src="assets/adventure.png"
         alt="Temporary Series Selection">

    <div class="overlayPanel">
      <div class="panel">
        <h1>CHOOSE SERIES</h1>

        <p>
          मूळ Choose Series फोटो नंतर जोडू.
        </p>

        <div class="choiceRow">
          <button class="choice"
            onclick="chooseSeries('Village')">
            Village<br>SELECT
          </button>

          <button class="choice"
            onclick="chooseSeries('City')">
            City<br>LOCKED
          </button>

          <button class="choice"
            onclick="chooseSeries('Mountain')">
            Mountain<br>LOCKED
          </button>

          <button class="choice"
            onclick="chooseSeries('Desert')">
            Desert<br>LOCKED
          </button>

          <button class="choice"
            onclick="chooseSeries('Forest')">
            Forest<br>LOCKED
          </button>
        </div>
      </div>
    </div>

    <button id="seriesBack"
      class="hit"
      style="left:1%;top:2%;width:8%;height:14%;"
      onclick="go('garage')">
      <span style="color:white;font-weight:bold;">BACK</span>
    </button>
  </section>

  <div id="notice" role="status"></div>
</div>

<script>
/* SCREEN NAVIGATION */
const screens = document.querySelectorAll('.screen');

function go(id) {
  screens.forEach(screen => {
    screen.classList.toggle('active', screen.id === id);
  });

  hideNotice();
}

/* LOADING BAR: 0% TO 100% */
let progress = 0;

const progressEl = document.getElementById('progress');
const percentEl = document.getElementById('loadPercent');

const loader = setInterval(function() {
  progress = Math.min(100, progress + 1);

  progressEl.style.width = progress + '%';
  percentEl.textContent = 'Loading ' + progress + '%';

  if (progress >= 100) {
    clearInterval(loader);

    setTimeout(function() {
      go('home');
    }, 350);
  }
}, 35);

/* PLAYER SELECTION */
const players = [
  {
    file: 'assets/player_1.png',
    name: 'Turbo Golu',
    locked: false
  },
  {
    file: 'assets/player_2.png',
    name: 'Nitro Chotu',
    locked: true
  },
  {
    file: 'assets/player_3.png',
    name: 'Dr. Bubbly',
    locked: true
  },
  {
    file: 'assets/player_4.png',
    name: 'Rinku Rocker',
    locked: true
  },
  {
    file: 'assets/player_5.png',
    name: 'Mukka Max',
    locked: true
  }
];

let playerIndex = 0;

function changePlayer(direction) {
  playerIndex =
    (playerIndex + direction + players.length) % players.length;

  const player = players[playerIndex];

  document.getElementById('playerBg').src = player.file;
  document.getElementById('playerBg').alt = player.name;

  showNotice(
    player.name + (player.locked ? ' — LOCKED' : '')
  );
}

function selectPlayer() {
  const player = players[playerIndex];

  if (player.locked) {
    showNotice(player.name + ' सध्या LOCKED आहे.');
  } else {
    showNotice(player.name + ' निवडला!');

    setTimeout(function() {
      go('garage');
    }, 700);
  }
}

/* TEMPORARY CAR SELECTION */
const cars = [
  'Raja Rocket',
  'Turbo Thunder',
  'Desert King',
  'Monster Wheels',
  'Fire Storm',
  'Golden Bullet'
];

let carIndex = 0;

function changeCar(direction) {
  carIndex = (carIndex + direction + cars.length) % cars.length;

  document.getElementById('carName').textContent =
    cars[carIndex];
}

function selectCar() {
  showNotice(cars[carIndex] + ' निवडली!');

  setTimeout(function() {
    go('garage');
  }, 700);
}

/* SERIES SELECTION */
function chooseSeries(name) {
  if (name === 'Village') {
    showNotice('Village Series निवडली!');

    setTimeout(function() {
      go('garage');
    }, 700);
  } else {
    showNotice(name + ' Series सध्या LOCKED आहे.');
  }
}

/* NOTIFICATION MESSAGE */
let noticeTimer;

function showNotice(message) {
  const notice = document.getElementById('notice');

  notice.textContent = message;
  notice.style.display = 'block';

  clearTimeout(noticeTimer);

  noticeTimer = setTimeout(function() {
    notice.style.display = 'none';
  }, 2200);
}

function hideNotice() {
  document.getElementById('notice').style.display = 'none';
}
</script>

</body>
  </html>
