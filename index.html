
<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Race Ka Raja - Rocket Buggy Racer</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Arial,sans-serif;color:white}
#game{position:relative;width:100%;height:100%;display:grid;place-items:center;background:#111}
#stage{position:relative;width:min(100vw,177.7778vh);height:min(100vh,56.25vw);aspect-ratio:16/9;overflow:hidden;background:#422c19}
.screen{position:absolute;inset:0;display:none;overflow:hidden}
.screen.active{display:block}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shade{position:absolute;inset:0;background:linear-gradient(0deg,#0007,transparent 45%,#0002)}
button{font-weight:900;color:white;cursor:pointer;border:2px solid #ffe27b;border-radius:12px;background:linear-gradient(#ffb523,#e95000);text-shadow:1px 2px 3px #421500;box-shadow:0 3px 0 #702900;padding:1% 2%;font-size:clamp(10px,2vw,23px)}
button:active{transform:scale(.96)}
.title{position:absolute;top:4%;left:4%;right:4%;text-align:center;font-size:clamp(20px,5vw,52px);font-weight:1000;color:#ffe43c;text-shadow:3px 4px 2px #431600,-1px -1px white}
.menu{position:absolute;bottom:5%;left:3%;right:3%;display:flex;justify-content:space-around;align-items:end;gap:1%}
.menu button{width:19%;min-height:14%;padding:1%;white-space:normal}
.menu button span{display:block;font-size:clamp(9px,1.5vw,17px);margin-top:4px}
.back{position:absolute;left:2%;top:3%;z-index:5}
.center{position:absolute;inset:15% 5% 22%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px}
.bigbtn{min-width:25%;padding:1.5%}
.cardimg{width:45%;height:65%;object-fit:contain;filter:drop-shadow(0 4px 5px #0009)}
.arrows{display:flex;align-items:center;justify-content:center;gap:8%;width:100%}
.arrows button{min-width:12%;font-size:clamp(18px,3vw,34px)}
.caption{font-size:clamp(15px,3vw,30px);font-weight:900;text-shadow:2px 2px 4px black}
.counter{font-size:clamp(12px,2vw,20px)}
#loading .loadtitle{position:absolute;top:8%;width:100%;text-align:center;font-size:clamp(25px,7vw,75px);font-weight:1000;color:#ffe62b;text-shadow:4px 4px #591900}
#loading .subtitle{position:absolute;top:33%;width:100%;text-align:center;font-size:clamp(16px,4vw,43px);font-weight:900;text-shadow:3px 3px #000}
.loadbox{position:absolute;left:15%;width:70%;bottom:12%;height:7%;border:4px solid #ffe68b;border-radius:30px;background:#321500;padding:3px}
#loadbar{height:100%;width:0;border-radius:20px;background:repeating-linear-gradient(120deg,#ffed31 0 12px,#ff7900 12px 24px);transition:width .12s}
#loadpct{position:absolute;bottom:3%;width:100%;text-align:center;font-size:clamp(14px,2.5vw,25px);font-weight:bold;text-shadow:2px 2px black}
.serieslist{display:grid;grid-template-columns:repeat(5,1fr);gap:1%;width:100%}
.serieslist button{min-height:60px;padding:5px 1px}
.locked{filter:grayscale(.5);opacity:.85}
#notice{position:absolute;z-index:20;top:5%;left:20%;right:20%;padding:10px;background:#222e;border:2px solid orange;border-radius:10px;text-align:center;display:none;font-size:clamp(12px,2vw,20px)}
#racecar{font-size:clamp(50px,12vw,120px);position:absolute;bottom:15%;left:40%}
#raceinfo{position:absolute;top:5%;width:100%;text-align:center;font-size:clamp(16px,3vw,30px);font-weight:bold}
@media (orientation:portrait){#stage{width:100vw;height:56.25vw;flex-shrink:0}#game{overflow:hidden}#rotate{display:block!important}}
#rotate{display:none;position:fixed;z-index:100;inset:0;background:#111;color:white;text-align:center;padding:25vh 8vw;font-size:22px}
</style>
</head>
<body>
<div id="game">
<div id="stage">

<section id="loading" class="screen active">
<img class="bg" data-drive="1dtYrA_6Ib4wk6_BKCI153LcGIDQJbHlV" alt="">
<div class="shade"></div>
<div class="loadtitle">Race Ka Raja</div>
<div class="subtitle">Rocket Buggy Racer</div>
<div class="loadbox"><div id="loadbar"></div></div>
<div id="loadpct">Loading... 0%</div>
</section>

<section id="home" class="screen">
<img class="bg" data-drive="1GYQjwfzY7wWeMwcMqQtNQwS0bW4h2UUK" alt="">
<div class="shade"></div>
<div class="menu">
<button onclick="popup('Settings')">⚙️<span>Settings</span></button>
<button onclick="popup('Help')">❔<span>Get Help</span></button>
<button onclick="popup('News')">📰<span>News</span></button>
<button onclick="popup('Sign in')">🎮<span>Sign in</span></button>
<button onclick="go('adventure')">🏁<span>Play</span></button>
</div>
</section>

<section id="adventure" class="screen">
<img class="bg" data-drive="1sViX1L1P3gTmFeLGtwlq1qR_Xem7Hp_3" alt="">
<div class="shade"></div>
<div class="menu">
<button onclick="popup('Upgrade')">🔧<span>Upgrade</span></button>
<button onclick="go('powerups')">❓<span>Powerups</span></button>
<button onclick="openCar()">🏎️<span>Switch Car</span></button>
<button onclick="openPlayer()">👨<span>Switch Player</span></button>
<button onclick="go('series')">🏁<span>Choose Series</span></button>
</div>
</section>

<section id="series" class="screen">
<img class="bg" data-drive="1SM6OqjlRerfsZFD9LTzKySPgw_JIvOMV" alt="">
<div class="shade"></div>
<button class="back" onclick="go('adventure')">⬅ Back</button>
<div class="title">CHOOSE SERIES</div>
<div class="center">
<div class="serieslist">
<button onclick="go('race')">🏡<br>Village<br>🔓</button>
<button class="locked" onclick="popup('City Series Locked')">🏙️<br>City<br>🔒</button>
<button class="locked" onclick="popup('Mountain Series Locked')">⛰️<br>Mountain<br>🔒</button>
<button class="locked" onclick="popup('Desert Series Locked')">🏜️<br>Desert<br>🔒</button>
<button class="locked" onclick="popup('Forest Series Locked')">🌲<br>Forest<br>🔒</button>
</div>
<button class="bigbtn" onclick="go('race')">START RACE 🏁</button>
</div>
</section>

<section id="cars" class="screen">
<img class="bg" data-drive="1sViX1L1P3gTmFeLGtwlq1qR_Xem7Hp_3" alt="">
<div class="shade"></div>
<button class="back" onclick="go('adventure')">⬅ Back</button>
<div class="title">SELECT YOUR CAR</div>
<div class="center">
<div class="arrows">
<button onclick="moveCar(-1)">❮</button>
<img id="carimg" class="cardimg" alt="Car">
<button onclick="moveCar(1)">❯</button>
</div>
<div id="carname" class="caption">Raja Rocket</div>
<div id="carcount" class="counter">1 / 6</div>
<button class="bigbtn" onclick="go('adventure')">SELECT ✓</button>
</div>
</section>

<section id="players" class="screen">
<img class="bg" data-drive="1sViX1L1P3gTmFeLGtwlq1qR_Xem7Hp_3" alt="">
<div class="shade"></div>
<button class="back" onclick="go('adventure')">⬅ Back</button>
<div class="title">SELECT YOUR PLAYER</div>
<div class="center">
<div class="arrows">
<button onclick="movePlayer(-1)">❮</button>
<img id="playerimg" class="cardimg" alt="Player">
<button onclick="movePlayer(1)">❯</button>
</div>
<div id="playername" class="caption">Turbo Golu</div>
<div id="playerpower" class="counter">Samosa Boost</div>
<div id="playercount" class="counter">1 / 6</div>
<button class="bigbtn" onclick="go('adventure')">SELECT ✓</button>
</div>
</section>

<section id="powerups" class="screen">
<img class="bg" data-drive="1ykC0JKp-ELQS73P2D65ojNPZ2yykjZ4G" alt="">
<div class="shade"></div>
<button class="back" onclick="go('adventure')">⬅ Back</button>
<div class="title">POWERUPS</div>
<div class="center">
<div class="caption">⚡ Nitro Boost</div>
<div class="caption">🚀 Rocket Attack</div>
<div class="caption">🛡️ Shield</div>
<div class="caption">💣 Trap</div>
<button class="bigbtn" onclick="go('race')">RACE NOW 🏁</button>
</div>
</section>

<section id="race" class="screen">
<img class="bg" data-drive="1sViX1L1P3gTmFeLGtwlq1qR_Xem7Hp_3" alt="">
<div class="shade"></div>
<div id="raceinfo">VILLAGE RACE — READY!</div>
<div id="racecar">🏎️</div>
<div class="menu">
<button onclick="raceMove(-1)">⬅<span>LEFT</span></button>
<button onclick="raceBoost()">⚡<span>BOOST</span></button>
<button onclick="raceMove(1)">➡<span>RIGHT</span></button>
<button onclick="go('adventure')">🏠<span>EXIT</span></button>
</div>
</section>

<div id="notice"></div>
</div>
</div>
<div id="rotate">📱 कृपया फोन Landscape (आडवा) करा.</div>

<script>
"use strict";

const driveURL = id =>
  "https://drive.google.com/thumbnail?id=" +
  encodeURIComponent(id) + "&sz=w1600";

const cars = [
 ["Raja Rocket","1PeuhW3YQAaphsL7Nm1TK3P5rXeKFXmQo"],
 ["Turbo Thunder","1Op1sQX5TKHjInAneUprthsTOMPQ0uRgm"],
 ["Desert King","15Rg7fK-SbRThhZbIeGSsxFdqhSxdCPa1"],
 ["Monster Wheels","1P3yhos8L6wuHvd_yTm1uCTjxQEPLUDNP"],
 ["Fire Storm","1liLlBqbloOZrOW4et-T7wAPB7jgIi9YJ"],
 ["Golden Bullet","1MEe7kZfbz6jFP5hs8SvSPLm_jUGq4-57"]
];

const players = [
 ["Turbo Golu","Samosa Boost","1etvsRlyh3Sc-4BYESFtsel5H8MlHkNO4"],
 ["Nitro Chotu","Bee Attack","19wQXN7ODSc5GrPZm3vWTIY0dRmtNSLZ7"],
 ["Dr. Bubbly","Acid Trap","1aYpPdXUVu9OWMILsfgKJhINUQhZYhz_-"],
 ["Rinku Rocker","DJ Shockwave","1gaMw6nr7Rne_PCJNEQYCRGi_o1JqBbwW"],
 ["Mukka Max","Rocket Storm","1rGPQZvsfk5gdYaPZgDRxb6S9OxIQcw5A"],
 ["Buslly Baba","Missile Boost","1gaMw6nr7Rne_PCJNEQYCRGi_o1JqBbwW"]
];

let carIndex=0, playerIndex=0, noticeTimer=null;

function go(id){
  const target=document.getElementById(id);
  if(!target){
    showNotice("Screen सापडली नाही: "+id);
    return;
  }
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  target.classList.add("active");
  document.getElementById("notice").style.display="none";
}

function showNotice(message){
  const n=document.getElementById("notice");
  n.textContent=message;
  n.style.display="block";
  clearTimeout(noticeTimer);
  noticeTimer=setTimeout(()=>n.style.display="none",2500);
}

function popup(message){
  showNotice(message);
}

function openCar(){
  updateCar();
  go("cars");
}
function updateCar(){
  document.getElementById("carname").textContent=cars[carIndex][0];
  document.getElementById("carcount").textContent=(carIndex+1)+" / "+cars.length;
  document.getElementById("carimg").src=driveURL(cars[carIndex][1]);
}
function moveCar(step){
  carIndex=(carIndex+step+cars.length)%cars.length;
  updateCar();
}

function openPlayer(){
  updatePlayer();
  go("players");
}
function updatePlayer(){
  const p=players[playerIndex];
  document.getElementById("playername").textContent=p[0];
  document.getElementById("playerpower").textContent=p[1];
  document.getElementById("playercount").textContent=(playerIndex+1)+" / "+players.length;
  document.getElementById("playerimg").src=driveURL(p[2]);
}
function movePlayer(step){
  playerIndex=(playerIndex+step+players.length)%players.length;
  updatePlayer();
}

let lane=0,boost=0;
function raceMove(step){
  lane=Math.max(-2,Math.min(2,lane+step));
  document.getElementById("racecar").style.left=(40+lane*8)+"%";
}
function raceBoost(){
  boost++;
  document.getElementById("raceinfo").textContent="BOOST! ⚡ "+boost;
}

function startGame(){
  // Every screen has a background fallback if Drive images cannot load.
  document.querySelectorAll("img[data-drive]").forEach(img=>{
    img.src=driveURL(img.dataset.drive);
    img.onerror=()=>{img.style.display="none";};
  });

  updateCar();
  updatePlayer();

  const bar=document.getElementById("loadbar");
  const label=document.getElementById("loadpct");
  let progress=0;

  const loadingInterval=setInterval(()=>{
    progress=Math.min(100,progress+2);
    bar.style.width=progress+"%";
    label.textContent="Loading... "+progress+"%";

    if(progress>=100){
      clearInterval(loadingInterval);
      // Loading screen remains visible briefly, then opens Home.
      setTimeout(()=>go("home"),400);
    }
  },50);
}

window.addEventListener("error",function(){
  showNotice("Game error. Page refresh करून पुन्हा प्रयत्न करा.");
});

window.addEventListener("DOMContentLoaded",startGame);
</script>
</body>
</html>
