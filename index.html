
<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#100b08">
  <title>Race Ka Raja - Rocket Buggy Racer</title>
  <link rel="stylesheet" href="css/game.css?v=5">
</head>
<body>
<div id="game">

  <div id="rotateMessage">कृपया मोबाईल आडवा (Landscape) फिरवा.</div>

  <!-- LOADING -->
  <section id="loading" class="screen active">
    <img class="bg" src="images/loading.png" alt="Loading">
    <div id="progressTrack"><div id="progress"></div></div>
    <div id="loadPercent">Loading 0%</div>
  </section>

  <!-- HOME -->
  <section id="home" class="screen">
    <img class="bg" src="images/home.png" alt="Home">

    <button class="hit" aria-label="Settings"
      style="left:5%;top:68%;width:14%;height:27%"
      onclick="showNotice('Settings लवकरच जोडू.')"></button>

    <button class="hit" aria-label="Get Help"
      style="left:20%;top:68%;width:14%;height:27%"
      onclick="showNotice('Help लवकरच जोडू.')"></button>

    <button class="hit" aria-label="News"
      style="left:35%;top:68%;width:14%;height:27%"
      onclick="showNotice('News लवकरच जोडू.')"></button>

    <button class="hit" aria-label="Signin"
      style="left:50%;top:68%;width:14%;height:27%"
      onclick="showNotice('Signin लवकरच जोडू.')"></button>

    <button class="hit" aria-label="Play"
      style="left:72%;top:60%;width:26%;height:37%"
      onclick="go('adventure')"></button>
  </section>

  <!-- ADVENTURE -->
  <section id="adventure" class="screen">
    <img class="bg" src="images/adventure.png" alt="Adventure">

    <button class="hit" aria-label="Back"
      style="left:0;top:0;width:9%;height:17%"
      onclick="backScreen()"></button>

    <button class="hit" aria-label="Race Ka Raja"
      style="left:10%;top:0;width:22%;height:17%"
      onclick="showNotice('Race Ka Raja')"></button>

    <button class="hit" aria-label="Gift"
      style="left:43%;top:0;width:10%;height:17%"
      onclick="showNotice('Gift लवकरच उपलब्ध होईल.')"></button>

    <button class="hit" aria-label="Daily Reward"
      style="left:0;top:52%;width:17%;height:27%"
      onclick="showNotice('Daily Reward लवकरच जोडू.')"></button>

    <button class="hit" aria-label="Daily Challenge"
      style="right:0;top:52%;width:18%;height:27%"
      onclick="showNotice('Daily Challenge लवकरच जोडू.')"></button>

    <button class="hit" aria-label="Adventure"
      style="left:35%;bottom:0;width:30%;height:32%"
      onclick="go('garage')"></button>
  </section>

  <!-- GARAGE / MAIN MENU -->
  <section id="garage" class="screen">
    <img class="bg" src="images/garage.png?v=3" alt="Garage">

    <img id="menuPlayer" src="images/menu-player1.png?v=1" alt="Player">

    <button class="hit" aria-label="Back"
      style="left:0;top:0;width:8%;height:18%"
      onclick="backScreen()"></button>

    <button class="hit" aria-label="Race Ka Raja"
      style="left:8%;top:0;width:20%;height:17%"
      onclick="showNotice('Race Ka Raja: 0/50')"></button>

    <button class="hit" aria-label="Gift"
      style="left:43%;top:0;width:10%;height:17%"
      onclick="showNotice('Gift लवकरच उपलब्ध होईल.')"></button>

    <button class="hit" aria-label="Upgrade"
      style="left:0;bottom:0;width:17%;height:28%"
      onclick="showNotice('Upgrade लवकरच जोडू.')"></button>

    <button class="hit" aria-label="Powerups"
      style="left:18%;bottom:0;width:16%;height:28%"
      onclick="go('powerups')"></button>

    <button class="hit" aria-label="Switch Car"
      style="left:34%;bottom:0;width:16%;height:28%"
      onclick="openCars()"></button>

    <button class="hit" aria-label="Switch Player"
      style="left:51%;bottom:0;width:17%;height:28%"
      onclick="openPlayers()"></button>

    <button class="hit" aria-label="Choose Series"
      style="right:0;bottom:0;width:26%;height:30%"
      onclick="go('series')"></button>
  </section>

  <!-- POWERUPS -->
  <section id="powerups" class="screen">
    <img class="bg" src="images/powerups.png" alt="Powerups">

    <button class="hit" aria-label="Back"
      style="left:0;top:0;width:10%;height:20%"
      onclick="backScreen()"></button>
  </section>

  <!-- CHOOSE SERIES -->
  <section id="series" class="screen">
    <img class="bg" src="images/series.png" alt="Choose Series">

    <button class="hit" aria-label="Back"
      style="left:0;top:0;width:10%;height:20%"
      onclick="backScreen()"></button>

    <button class="hit" aria-label="Village"
      style="left:2%;top:18%;width:19%;height:72%"
      onclick="chooseSeries('Village',false)"></button>

    <button class="hit" aria-label="City"
      style="left:21%;top:18%;width:19%;height:72%"
      onclick="chooseSeries('City',true)"></button>

    <button class="hit" aria-label="Mountain"
      style="left:40%;top:18%;width:19%;height:72%"
      onclick="chooseSeries('Mountain',true)"></button>

    <button class="hit" aria-label="Desert"
      style="left:59%;top:18%;width:19%;height:72%"
      onclick="chooseSeries('Desert',true)"></button>

    <button class="hit" aria-label="Forest"
      style="left:78%;top:18%;width:20%;height:72%"
      onclick="chooseSeries('Forest',true)"></button>
  </section>

  <!-- PLAYER SELECTION -->
  <section id="players" class="screen">
    <img id="playerBg" class="bg" src="images/player1.png" alt="Player">

    <button class="hit" aria-label="Back"
      style="left:0;top:0;width:10%;height:18%"
      onclick="backScreen()"></button>

    <button class="hit" aria-label="Character Information"
      style="left:0;bottom:20%;width:28%;height:18%"
      onclick="showNotice('Character information')"></button>

    <button class="hit" aria-label="Previous Player"
      style="left:27%;bottom:0;width:13%;height:24%"
      onclick="changeItem('player',-1)"></button>

    <button class="hit" aria-label="Select Player"
      style="left:40%;bottom:0;width:24%;height:24%"
      onclick="selectItem('player')"></button>

    <button class="hit" aria-label="Next Player"
      style="left:64%;bottom:0;width:13%;height:24%"
      onclick="changeItem('player',1)"></button>
  </section>

  <!-- CAR SELECTION -->
  <section id="cars" class="screen">
    <img id="carBg" class="bg" src="images/car1.png" alt="Car">

    <button class="hit" aria-label="Back"
      style="left:0;top:0;width:10%;height:18%;z-index:10"
      onclick="backScreen()"></button>

    <button class="hit" aria-label="Previous Car"
      style="left:27%;bottom:0;width:13%;height:24%;z-index:10"
      onclick="changeItem('car',-1)"></button>

    <button class="hit" aria-label="Select Car"
      style="left:40%;bottom:0;width:24%;height:24%;z-index:10"
      onclick="selectItem('car')"></button>

    <button class="hit" aria-label="Next Car"
      style="left:64%;bottom:0;width:13%;height:24%;z-index:10"
      onclick="changeItem('car',1)"></button>
  </section>

  <div id="notice" role="status"></div>
</div>

<script src="js/main.js?v=5"></script>
</body>
</html>
