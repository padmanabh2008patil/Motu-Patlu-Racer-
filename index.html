
<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#100b08">
<title>Race Ka Raja: Rocket Buggy Racer</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #100b08;
  font-family: Arial, sans-serif;
}

#game {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  height: 100dvh;
  overflow: hidden;
  background: #100b08;
}

.screen {
  position: absolute;
  inset: 0;
  display: none;
  overflow: hidden;
}

.screen.active {
  display: block;
}

.bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: fill;
}

.hit {
  position: absolute;
  z-index: 3;
  padding: 0;
  border: 0;
  background: transparent;
  touch-action: manipulation;
}

/* Back arrow */
.backBtn {
  position: absolute;
  z-index: 8;
  top: 2%;
  left: 1.2%;
  width: 66px;
  height: 66px;
  border: 0;
  background: transparent;
  color: white;
  padding: 0;
}

.backCircle {
  display: flex;
  width: 43px;
  height: 43px;
  margin: auto;
  align-items: center;
  justify-content: center;
  border: 3px solid #ffcf43;
  border-radius: 50%;
  background: linear-gradient(#ffb52a, #f15a00);
  box-shadow: 0 2px 4px #000;
  font-size: 30px;
  font-weight: bold;
  line-height: 1;
}

.backText {
  display: block;
  color: white;
  font-size: 13px;
  font-weight: bold;
  text-shadow: 1px 2px 3px black;
}

#progressTrack {
  position: absolute;
  left: 20.7%;
  top: 78.2%;
  width: 58.5%;
  height: 5.8%;
  border: 3px solid #ffbd25;
  border-radius: 999px;
  overflow: hidden;
  background: #351000;
}

#progress {
  width: 0%;
  height: 100%;
  background: repeating-linear-gradient(
    45deg, #ff5b00 0 10px, #ff9a00 10px 20px
  );
}

#loadPercent {
  position: absolute;
  top: 86%;
  width: 100%;
  color: white;
  text-align: center;
  font-weight: bold;
  font-size: clamp(12px, 2vw, 24px);
  text-shadow: 2px 3px 3px black;
}

.itemLabel {
  position: absolute;
  z-index: 5;
  left: 50%;
  top: 3%;
  transform: translateX(-50%);
  max-width: 70%;
  padding: 8px 16px;
  border: 2px solid #ffca36;
  border-radius: 12px;
  background: #351000dd;
  color: #ffcf27;
  text-align: center;
  font-size: clamp(14px, 2.5vw, 30px);
  font-weight: bold;
  white-space: nowrap;
}

#notice {
  display: none;
  position: absolute;
  z-index: 20;
  left: 50%;
  bottom: 2%;
  transform: translateX(-50%);
  max-width: 90%;
  padding: 8px 14px;
  border: 2px solid #ffc22c;
  border-radius: 10px;
  background: #190700f2;
  color: white;
  text-align: center;
  font-size: clamp(12px, 1.5vw, 18px);
}

#rotateMessage {
  display: none;
  position: absolute;
  inset: 0;
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 10%;
  background: #180900;
  color: white;
  text-align: center;
  font-size: 22px;
}

@media (orientation: portrait) {
  #rotateMessage {
    display: flex;
  }
}
</style>
</head>

<body>
<div id="game">

<div id="rotateMessage">
  कृपया मोबाईल आडवा (Landscape) फिरवा.
</div>

<!-- SCREEN 1: LOADING -->
<section id="loading" class="screen active">
  <img class="bg" src="images/loading.png" alt="Loading Screen">
  <div id="progressTrack">
    <div id="progress"></div>
  </div>
  <div id="loadPercent">Loading 0%</div>
</section>

<!-- SCREEN 2: HOME -->
<section id="home" class="screen">
  <img class="bg" src="images/home.png" alt="Home Screen">

  <button class="hit" aria-label="Play"
    style="left:72%;top:62%;width:25%;height:34%"
    onclick="go('adventure')"></button>
</section>

<!-- SCREEN 3: ADVENTURE -->
<section id="adventure" class="screen">
  <img class="bg" src="images/adventure.png" alt="Adventure Screen">

  <button class="backBtn" aria-label="Back"
    onclick="go('home')">
    <span class="backCircle">◀</span>
    <span class="backText">Back</span>
  </button>

  <button class="hit" aria-label="Adventure"
    style="left:35%;top:60%;width:30%;height:36%"
    onclick="go('garage')"></button>
</section>

<!-- SCREEN 4: MAIN GAME MENU -->
<section id="garage" class="screen">
  <img class="bg" src="images/garage.png" alt="Main Game Menu">

  <button class="backBtn" aria-label="Back"
    onclick="go('adventure')">
    <span class="backCircle">◀</span>
    <span class="backText">Back</span>
  </button>

  <!-- Upgrade -->
  <button class="hit" aria-label="Upgrade"
    style="left:0%;top:69%;width:16%;height:29%"
    onclick="showNotice('Upgrade स्क्रीन नंतर जोडू.')"></button>

  <!-- Powerups -->
  <button class="hit" aria-label="Powerups"
    style="left:17%;top:69%;width:16%;height:29%"
    onclick="go('powerups')"></button>

  <!-- Switch Car -->
  <button class="hit" aria-label="Switch Car"
    style="left:34%;top:69%;width:15%;height:29%"
    onclick="openCars()"></button>

  <!-- Switch Player -->
  <button class="hit" aria-label="Switch Player"
    style="left:50%;top:69%;width:16%;height:29%"
    onclick="openPlayers()"></button>

  <!-- Choose Series -->
  <button class="hit" aria-label="Choose Series"
    style="left:67%;top:69%;width:18%;height:29%"
    onclick="go('series')"></button>
</section>

<!-- SCREEN 5: POWERUPS -->
<section id="powerups" class="screen">
  <img class="bg" src="images/powerups.png" alt="Powerups Screen">

  <button class="backBtn" aria-label="Back"
    onclick="go('garage')">
    <span class="backCircle">◀</span>
    <span class="backText">Back</span>
  </button>
</section>

<!-- SCREEN 6: CHOOSE SERIES -->
<section id="series" class="screen">
  <img class="bg" src="images/series.png" alt="Choose Series Screen">

  <button class="backBtn" aria-label="Back"
    onclick="go('garage')">
    <span class="backCircle">◀</span>
    <span class="backText">Back</span>
  </button>

  <!-- Series selection areas; adjust positions to match artwork -->
  <button class="hit" aria-label="Village"
    style="left:5%;top:20%;width:18%;height:65%"
    onclick="chooseSeries('Village', false)"></button>

  <button class="hit" aria-label="City"
    style="left:24%;top:20%;width:18%;height:65%"
    onclick="chooseSeries('City', true)"></button>

  <button class="hit" aria-label="Mountain"
    style="left:43%;top:20%;width:18%;height:65%"
    onclick="chooseSeries('Mountain', true)"></button>

  <button class="hit" aria-label="Desert"
    style="left:62%;top:20%;width:18%;height:65%"
    onclick="chooseSeries('Desert', true)"></button>

  <button class="hit" aria-label="Forest"
    style="left:81%;top:20%;width:18%;height:65%"
    onclick="chooseSeries('Forest', true)"></button>
</section>

<!-- SCREEN 7: PLAYER SELECTION -->
<section id="players" class="screen">
  <img id="playerBg" class="bg"
    src="images/player1.png" alt="Player 1">

  <button class="backBtn" aria-label="Back"
    onclick="go('garage')">
    <span class="backCircle">◀</span>
    <span class="backText">Back</span>
  </button>

  <div id="playerLabel" class="itemLabel">Player 1</div>

  <button class="hit" aria-label="Previous Player"
    style="left:0;top:35%;width:15%;height:40%"
    onclick="changeItem('player',-1)"></button>

  <button class="hit" aria-label="Next Player"
    style="right:0;top:35%;width:15%;height:40%"
    onclick="changeItem('player',1)"></button>

  <button class="hit" aria-label="Select Player"
    style="left:40%;bottom:0;width:20%;height:18%"
    onclick="selectItem('player')"></button>
</section>

<!-- SCREEN 8: CAR SELECTION -->
<section id="cars" class="screen">
  <img id="carBg" class="bg"
    src="images/car1.png" alt="Car 1">

  <button class="backBtn" aria-label="Back"
    onclick="go('garage')">
    <span class="backCircle">◀</span>
    <span class="backText">Back</span>
  </button>

  <div id="carLabel" class="itemLabel">Car 1</div>

  <button class="hit" aria-label="Previous Car"
    style="left:0;top:35%;width:15%;height:40%"
    onclick="changeItem('car',-1)"></button>

  <button class="hit" aria-label="Next Car"
    style="right:0;top:35%;width:15%;height:40%"
    onclick="changeItem('car',1)"></button>

  <button class="hit" aria-label="Select Car"
    style="left:40%;bottom:0;width:20%;height:18%"
    onclick="selectItem('car')"></button>
</section>

<div id="notice" role="status"></div>
</div>

<script>
const screens = document.querySelectorAll('.screen');

function go(id) {
  screens.forEach(screen => {
    screen.classList.toggle('active', screen.id === id);
  });
  hideNotice();
}

/* LOADING: 0 TO 100 */
let progress = 0;
const progressEl = document.getElementById('progress');
const percentEl = document.getElementById('loadPercent');

const loader = setInterval(() => {
  progress = Math.min(100, progress + 1);
  progressEl.style.width = progress + '%';
  percentEl.textContent = 'Loading ' + progress + '%';

  if (progress >= 100) {
    clearInterval(loader);
    setTimeout(() => go('home'), 400);
  }
}, 35);

/* PLAYER AND CAR */
let playerIndex = 0;
let carIndex = 0;
let selectedPlayer = 0;
let selectedCar = 0;

function openPlayers() {
  playerIndex = selectedPlayer;
  updateItem('player');
  go('players');
}

function openCars() {
  carIndex = selectedCar;
  updateItem('car');
  go('cars');
}

function changeItem(type, direction) {
  if (type === 'player') {
    playerIndex = (playerIndex + direction + 6) % 6;
  } else {
    carIndex = (carIndex + direction + 6) % 6;
  }
  updateItem(type);
}

function updateItem(type) {
  if (type === 'player') {
    const file = 'images/player' + (playerIndex + 1) + '.png';
    document.getElementById('playerBg').src = file;
    document.getElementById('playerBg').alt =
      'Player ' + (playerIndex + 1);
    document.getElementById('playerLabel').textContent =
      'Player ' + (playerIndex + 1);
  } else {
    const file = 'images/car' + (carIndex + 1) + '.png';
    document.getElementById('carBg').src = file;
    document.getElementById('carBg').alt =
      'Car ' + (carIndex + 1);
    document.getElementById('carLabel').textContent =
      'Car ' + (carIndex + 1);
  }
}

function selectItem(type) {
  if (type === 'player') {
    selectedPlayer = playerIndex;
    showNotice('Player ' + (playerIndex + 1) + ' निवडला!');
  } else {
    selectedCar = carIndex;
    showNotice('Car ' + (carIndex + 1) + ' निवडली!');
  }

  setTimeout(() => go('garage'), 700);
}

/* SERIES */
function chooseSeries(name, locked) {
  if (locked) {
    showNotice(name + ' सध्या LOCKED आहे.');
    return;
  }

  showNotice(name + ' Series निवडली!');
  setTimeout(() => go('garage'), 700);
}

/* NOTICE */
let noticeTimer;

function showNotice(message) {
  const notice = document.getElementById('notice');
  notice.textContent = message;
  notice.style.display = 'block';

  clearTimeout(noticeTimer);
  noticeTimer = setTimeout(hideNotice, 2200);
}

function hideNotice() {
  const notice = document.getElementById('notice');
  notice.style.display = 'none';
  clearTimeout(noticeTimer);
}
</script>
</body>
</html>
