
<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#100b08">
  <title>Race Ka Raja - Rocket Buggy Racer</title>

  <link rel="stylesheet" href="css/game.css">
</head>

<body>
<div id="game">

  <div id="rotateMessage">
    कृपया मोबाईल आडवा (Landscape) फिरवा.
  </div>

  <!-- 1: LOADING SCREEN -->
  <section id="loading" class="screen active">
    <img class="bg" src="images/loading.png" alt="Loading">
    <div id="progressTrack">
      <div id="progress"></div>
    </div>
    <div id="loadPercent">Loading 0%</div>
  </section>

  <!-- 2: HOME SCREEN -->
  <section id="home" class="screen">
    <img class="bg" src="images/home.png" alt="Race Ka Raja Home">

    <button class="hit" aria-label="Play"
      style="left:72%;top:62%;width:25%;height:34%"
      onclick="go('adventure')">
    </button>
  </section>

  <!-- 3: ADVENTURE SCREEN -->
  <section id="adventure" class="screen">
    <img class="bg" src="images/adventure.png" alt="Adventure">

    <button class="backBtn" aria-label="Back"
      onclick="go('home')">
      <span class="backCircle">◀</span>
      <span class="backText">Back</span>
    </button>

    <button class="hit" aria-label="Adventure"
      style="left:35%;top:60%;width:30%;height:36%"
      onclick="go('garage')">
    </button>
  </section>

  <!-- 4: MAIN MENU -->
  <section id="garage" class="screen">
    <img class="bg" src="images/garage.png" alt="Game Menu">

    <button class="backBtn" aria-label="Back"
      onclick="go('adventure')">
      <span class="backCircle">◀</span>
      <span class="backText">Back</span>
    </button>

    <!-- Upgrade -->
    <button class="hit" aria-label="Upgrade"
      style="left:0%;top:69%;width:16%;height:29%"
      onclick="showNotice('Upgrade लवकरच जोडू.')">
    </button>

    <!-- Powerups -->
    <button class="hit" aria-label="Powerups"
      style="left:17%;top:69%;width:16%;height:29%"
      onclick="go('powerups')">
    </button>

    <!-- Switch Car -->
    <button class="hit" aria-label="Switch Car"
      style="left:34%;top:69%;width:15%;height:29%"
      onclick="openCars()">
    </button>

    <!-- Switch Player -->
    <button class="hit" aria-label="Switch Player"
      style="left:50%;top:69%;width:16%;height:29%"
      onclick="openPlayers()">
    </button>

    <!-- Choose Series -->
    <button class="hit" aria-label="Choose Series"
      style="left:67%;top:69%;width:18%;height:29%"
      onclick="go('series')">
    </button>
  </section>

  <!-- POWERUPS SCREEN -->
  <section id="powerups" class="screen">
    <img class="bg" src="images/powerups.png" alt="Powerups">

    <button class="backBtn" aria-label="Back"
      onclick="go('garage')">
      <span class="backCircle">◀</span>
      <span class="backText">Back</span>
    </button>
  </section>

  <!-- CHOOSE SERIES SCREEN -->
  <section id="series" class="screen">
    <img class="bg" src="images/series.png" alt="Choose Series">

    <button class="backBtn" aria-label="Back"
      onclick="go('garage')">
      <span class="backCircle">◀</span>
      <span class="backText">Back</span>
    </button>

    <button class="hit" aria-label="Village"
      style="left:5%;top:20%;width:18%;height:65%"
      onclick="chooseSeries('Village',false)">
    </button>

    <button class="hit" aria-label="City"
      style="left:24%;top:20%;width:18%;height:65%"
      onclick="chooseSeries('City',true)">
    </button>

    <button class="hit" aria-label="Mountain"
      style="left:43%;top:20%;width:18%;height:65%"
      onclick="chooseSeries('Mountain',true)">
    </button>

    <button class="hit" aria-label="Desert"
      style="left:62%;top:20%;width:18%;height:65%"
      onclick="chooseSeries('Desert',true)">
    </button>

    <button class="hit" aria-label="Forest"
      style="left:81%;top:20%;width:18%;height:65%"
      onclick="chooseSeries('Forest',true)">
    </button>
  </section>

  <!-- PLAYER SELECTION -->
  <section id="players" class="screen">
    <img id="playerBg" class="bg" src="images/player1.png" alt="Player">

    <button class="backBtn" aria-label="Back"
      onclick="go('garage')">
      <span class="backCircle">◀</span>
      <span class="backText">Back</span>
    </button>

    <button class="navArrow left" aria-label="Previous Player"
      onclick="changeItem('player',-1)">❮</button>

    <button class="navArrow right" aria-label="Next Player"
      onclick="changeItem('player',1)">❯</button>

    <button class="hit" aria-label="Select Player"
      style="left:40%;bottom:0;width:20%;height:18%"
      onclick="selectItem('player')">
    </button>
  </section>

  <!-- CAR SELECTION -->
  <section id="cars" class="screen">
    <img id="carBg" class="bg" src="images/car1.png" alt="Car">

    <button class="backBtn" aria-label="Back"
      onclick="go('garage')">
      <span class="backCircle">◀</span>
      <span class="backText">Back</span>
    </button>

    <button class="navArrow left" aria-label="Previous Car"
      onclick="changeItem('car',-1)">❮</button>

    <button class="navArrow right" aria-label="Next Car"
      onclick="changeItem('car',1)">❯</button>

    <button class="hit" aria-label="Select Car"
      style="left:40%;bottom:0;width:20%;height:18%"
      onclick="selectItem('car')">
    </button>
  </section>

  <div id="notice" role="status"></div>
</div>

<script src="js/main.js"></script>
</body>
</html>
