<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Motu-Patlu Racer</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

    <h1>
        🏎️ MOTU-PATLU RACER
    </h1>

    <p>
        Choose Your Racer
    </p>

</header>


<section class="character-section">

    <h2>
        🏁 Select Character
    </h2>


    <div class="characters">


        <!-- MOTU -->

        <div
            class="character-card"
            id="Motu"
            onclick="selectCharacter('Motu')">

            <div class="character-image">
                🏎️
            </div>

            <h3>
                Motu
            </h3>

            <p>
                READY
            </p>

        </div>


        <!-- PATLU -->

        <div
            class="character-card locked"
            id="Patlu"
            onclick="selectCharacter('Patlu')">

            <div class="character-image">
                🚗
            </div>

            <h3>
                Patlu
            </h3>

            <p>
                🔒 Level 5
            </p>

        </div>


        <!-- DR JHATKA -->

        <div
            class="character-card locked"
            id="Dr. Jhatka"
            onclick="selectCharacter('Dr. Jhatka')">

            <div class="character-image">
                🚙
            </div>

            <h3>
                Dr. Jhatka
            </h3>

            <p>
                🔒 Level 10
            </p>

        </div>


        <!-- SINGHAM -->

        <div
            class="character-card locked"
            id="Singham"
            onclick="selectCharacter('Singham')">

            <div class="character-image">
                🚓
            </div>

            <h3>
                Singham
            </h3>

            <p>
                🔒 Level 15
            </p>

        </div>


        <!-- DON -->

        <div
            class="character-card locked"
            id="Don"
            onclick="selectCharacter('Don')">

            <div class="character-image">
                🏁
            </div>

            <h3>
                Don
            </h3>

            <p>
                🔒 Level 20
            </p>

        </div>


    </div>


    <!-- START -->

    <button
        class="start-button"
        onclick="startGame()">

        🏁 START GAME

    </button>


</section>


<footer>

    Motu-Patlu Racer © 2026

</footer>


<script src="game.js"></script>


</body>

</html>
