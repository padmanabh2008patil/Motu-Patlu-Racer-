<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Motu-Patlu Racer - Levels</title>

<link rel="stylesheet" href="style.css">

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #141e30, #243b55);
    color: white;
    text-align: center;
}

header {
    padding: 25px 15px;
    background: linear-gradient(135deg, #ff9800, #e65100);
}

header h1 {
    margin: 0;
    font-size: 30px;
}

header p {
    font-size: 18px;
}

.levels-container {
    width: 92%;
    max-width: 800px;
    margin: 25px auto;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
}

.level {
    padding: 18px 5px;
    border-radius: 12px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    background: #eeeeee;
    color: #222;
    box-shadow: 0 5px 12px rgba(0,0,0,0.3);
}

.level:hover {
    transform: scale(1.05);
}

.locked {
    background: #666;
    color: #bbb;
    cursor: not-allowed;
}

.boss {
    background: #d32f2f;
    color: white;
    border: 3px solid #ffd700;
}

.boss:hover {
    transform: scale(1.05);
}

.boss small {
    display: block;
    font-size: 11px;
    margin-top: 5px;
}

.back-button {
    margin: 10px auto 30px;
    padding: 13px 30px;
    border: none;
    border-radius: 10px;
    background: #ff9800;
    color: white;
    font-size: 17px;
    font-weight: bold;
}

footer {
    padding: 20px;
    background: #111;
}

@media (max-width: 600px) {

    .levels-container {
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
    }

    .level {
        padding: 16px 3px;
    }

}

</style>

</head>


<body>

<header>

<h1>🏎️ MOTU-PATLU RACER</h1>

<p id="sectionTitle">
Choose Your Level
</p>

</header>


<div
    class="levels-container"
    id="levelsContainer">
</div>


<button
    class="back-button"
    onclick="goBack()">

⬅️ BACK

</button>


<footer>

Motu-Patlu Racer © 2026

</footer>


<script>

/* =========================
   SECTION SETTINGS
========================= */

const sections = {

    Village: {
        start: 1,
        end: 15,
        boss: "Patlu"
    },

    City: {
        start: 16,
        end: 30,
        boss: "Dr. Jhatka"
    },

    Mountain: {
        start: 31,
        end: 45,
        boss: "Ghisatu"
    },

    Desert: {
        start: 46,
        end: 60,
        boss: "Inspector Chingam"
    },

    "Snow Valley": {
        start: 61,
        end: 75,
        boss: "John"
    }

};


/* =========================
   GET SELECTED SECTION
========================= */

const selectedSection =
    localStorage.getItem("selectedSection")
    || "Village";


const section =
    sections[selectedSection];


/* =========================
   PLAYER PROGRESS
========================= */

let highestLevel =
    parseInt(
        localStorage.getItem("highestLevel")
    ) || 1;


/* =========================
   SECTION TITLE
========================= */

document.getElementById(
    "sectionTitle"
).innerHTML =
    "🌍 " +
    selectedSection +
    " — Levels " +
    section.start +
    " to " +
    section.end;


/* =========================
   CREATE LEVELS
========================= */

const container =
    document.getElementById(
        "levelsContainer"
    );


for (
    let level = section.start;
    level <= section.end;
    level++
) {

    const button =
        document.createElement("div");

    button.className = "level";

    /* LAST LEVEL = BOSS */

    if (level === section.end) {

        button.classList.add("boss");

        button.innerHTML =
            "🏆 " +
            level +
            "<small>VS " +
            section.boss +
            "</small>";

    } else {

        button.innerHTML =
            "🏁 " + level;

    }


    /* UNLOCK CHECK */

    if (level <= highestLevel) {

        button.onclick =
            function() {

                startLevel(level);

            };

    } else {

        button.classList.add("locked");

        button.innerHTML =
            "🔒 " + level;

        if (level === section.end) {

            button.innerHTML =
                "🔒 " +
                level +
                "<small>VS " +
                section.boss +
                "</small>";

        }

    }


    container.appendChild(button);

}


/*=========================
   START LEVEL
========================= */

function startLevel(level) {

    localStorage.setItem(
        "currentLevel",
        level
    );

    /*
    Check if this is
    the Boss Level
    */

    if (level === section.end) {

        localStorage.setItem(
            "currentBoss",
            section.boss
        );

    } else {

        localStorage.setItem(
            "currentBoss",
            ""
        );

    }

    /*
    Open Race
    */

    window.location.href =
        "race.html";

}


/* =========================
   BACK BUTTON
========================= */

function goBack() {

    window.location.href =
        "sections.html";

}

</script>

</body>

</html>
