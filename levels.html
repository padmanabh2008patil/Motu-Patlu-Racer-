<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Motu-Patlu Racer - Levels</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family: Arial, sans-serif;

    color: white;

    min-height: 100vh;

    text-align: center;

    background:
    linear-gradient(
        135deg,
        #111,
        #292929,
        #111
    );
}


/* HEADER */

.header {

    padding: 25px;

    background:
    linear-gradient(
        90deg,
        #ff6b00,
        #ffb300
    );

    box-shadow:
    0 4px 15px rgba(0,0,0,0.5);
}

.header h1 {

    margin: 0;

    font-size: 32px;

    text-shadow:
    3px 3px 5px black;
}

.header p {

    margin-top: 8px;

    font-size: 18px;
}


/* LEVEL SECTION */

.level-section {

    padding: 25px 15px;
}

.level-section h2 {

    font-size: 27px;

    margin-bottom: 25px;
}


/* LEVEL GRID */

.levels {

    display: grid;

    grid-template-columns:
    repeat(
        auto-fit,
        minmax(130px, 1fr)
    );

    gap: 18px;

    max-width: 700px;

    margin: auto;
}


/* LEVEL CARD */

.level {

    min-height: 120px;

    border-radius: 18px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    font-size: 22px;

    font-weight: bold;

    background:
    linear-gradient(
        145deg,
        #333,
        #181818
    );

    border: 3px solid #555;

    box-shadow:
    0 6px 15px rgba(0,0,0,0.5);

    cursor: pointer;

    transition: 0.25s;
}


.level:hover {

    transform:
    translateY(-5px)
    scale(1.03);

    border-color:
    #ff9800;
}


/* UNLOCKED */

.level.unlocked {

    border-color:
    #00e676;
}


/* LOCKED */

.level.locked {

    opacity: 0.45;

    cursor:
    not-allowed;
}


.lock {

    font-size: 30px;

    margin-bottom: 8px;
}


/* BACK BUTTON */

.back {

    margin-top: 30px;

    padding:
    12px 30px;

    border: none;

    border-radius: 25px;

    background:
    #555;

    color: white;

    font-size: 17px;

    cursor: pointer;
}


.back:hover {

    background:
    #777;
}


/* MOBILE */

@media(max-width:500px) {

    .header h1 {
        font-size: 27px;
    }

    .level {
        min-height: 105px;
        font-size: 19px;
    }

}

</style>

</head>


<body>


<!-- HEADER -->

<div class="header">

    <h1>
        🏎️ MOTU-PATLU RACER
    </h1>

    <p>
        🏁 Select Level
    </p>

</div>


<!-- LEVELS -->

<div class="level-section">

    <h2>
        🌍 Racing Levels
    </h2>


    <div
        class="levels"
        id="levelsContainer">
    </div>


    <button
        class="back"
        onclick="goBack()">

        ← Back

    </button>

</div>


<script>

/* ==============================
   GAME PROGRESS
============================== */


/*
   सुरुवातीला Level 1 unlocked
*/

let highestLevel =
    parseInt(
        localStorage.getItem(
            "highestLevel"
        )
    ) || 1;


/* ==============================
   CREATE LEVELS
============================== */

const container =
    document.getElementById(
        "levelsContainer"
    );


for (
    let level = 1;
    level <= 20;
    level++
) {

    const card =
        document.createElement(
            "div"
        );


    card.className =
        "level";


    /* UNLOCKED */

    if (level <= highestLevel) {

        card.classList.add(
            "unlocked"
        );


        card.innerHTML = `

            🏁

            <div>
                Level ${level}
            </div>

            <small>
                PLAY
            </small>

        `;


        card.onclick =
        function() {

            startLevel(level);

        };


    }


    /* LOCKED */

    else {

        card.classList.add(
            "locked"
        );


        card.innerHTML = `

            <div class="lock">
                🔒
            </div>

            <div>
                Level ${level}
            </div>

        `;


        card.onclick =
        function() {

            alert(
                "🔒 Level " +
                level +
                " is locked!\n\n" +
                "Complete Level " +
                (level - 1) +
                " first."
            );

        };

    }


    container.appendChild(card);

}


/* ==============================
   START LEVEL
============================== */

function startLevel(level) {

    localStorage.setItem(
        "currentLevel",
        level
    );


    window.location.href =
        "race.html";

}


/* ==============================
   BACK
============================== */

function goBack() {

    window.location.href =
        "index.html";

}

</script>


</body>

</html>
