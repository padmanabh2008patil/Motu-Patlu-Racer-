<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Motu-Patlu Racer - Level 1</title>

    <link rel="stylesheet" href="style.css">

    <style>

        body {
            overflow: hidden;
            background: #222;
        }

        .race-header {
            height: 70px;
            background: linear-gradient(90deg, #ff6b00, #ffb300);
            display: flex;
            justify-content: space-around;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
        }

        .race-area {
            position: relative;
            width: 100%;
            height: calc(100vh - 130px);
            overflow: hidden;
            background:
                linear-gradient(
                    90deg,
                    #238b45 0%,
                    #238b45 18%,
                    #555 18%,
                    #555 82%,
                    #238b45 82%,
                    #238b45 100%
                );
        }

        /* Road Lines */

        .road-line {
            position: absolute;
            left: 50%;
            width: 8px;
            height: 80px;
            background: white;
            transform: translateX(-50%);
            animation: roadMove 0.5s linear infinite;
        }

        .line1 {
            top: 0;
        }

        .line2 {
            top: 160px;
        }

        .line3 {
            top: 320px;
        }

        .line4 {
            top: 480px;
        }

        .line5 {
            top: 640px;
        }

        @keyframes roadMove {

            from {
                transform: translate(-50%, -100px);
            }

            to {
                transform: translate(-50%, 100vh);
            }

        }

        /* Cars */

        .car {
            position: absolute;
            width: 55px;
            height: 85px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 38px;
            transition: left 0.08s linear;
        }

        #playerCar {
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }

        .enemy1 {
            top: 100px;
            left: 35%;
        }

        .enemy2 {
            top: 180px;
            left: 60%;
        }

        .enemy3 {
            top: 300px;
            left: 42%;
        }

        .enemy4 {
            top: 420px;
            left: 65%;
        }

        /* Controls */

        .controls {
            position: absolute;
            bottom: 15px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 25px;
            z-index: 20;
        }

        .control-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 3px solid white;
            background: rgba(0,0,0,0.6);
            color: white;
            font-size: 30px;
            font-weight: bold;
        }

        .control-btn:active {
            transform: scale(0.9);
            background: #ff9800;
        }

        .race-message {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            font-size: 25px;
            font-weight: bold;
            text-shadow: 2px 2px 4px black;
        }

    </style>
</head>

<body>

    <div class="race-header">

        <div>
            🏁 LEVEL 1
        </div>

        <div>
            🏎️ <span id="playerName">Motu</span>
        </div>

        <div>
            🏆 Position:
            <span id="position">1</span>
        </div>

    </div>


    <div class="race-area">

        <div class="race-message" id="message">
            GO! 🏁
        </div>


        <!-- Road Lines -->

        <div class="road-line line1"></div>
        <div class="road-line line2"></div>
        <div class="road-line line3"></div>
        <div class="road-line line4"></div>
        <div class="road-line line5"></div>


        <!-- Player -->

        <div
            class="car"
            id="playerCar">
            🏎️
        </div>


        <!-- AI Racers -->

        <div class="car enemy1">
            🚗
        </div>

        <div class="car enemy2">
            🚙
        </div>

        <div class="car enemy3">
            🚓
        </div>

        <div class="car enemy4">
            🏁
        </div>


        <!-- Controls -->

        <div class="controls">

            <button
                class="control-btn"
                onclick="moveLeft()">
                ⬅️
            </button>

            <button
                class="control-btn"
                onclick="moveRight()">
                ➡️
            </button>

        </div>

    </div>


<script>

    // ==========================
    // PLAYER
    // ==========================

    let playerCar =
        document.getElementById("playerCar");

    let playerName =
        localStorage.getItem("selectedCharacter");

    if (playerName) {

        document.getElementById(
            "playerName"
        ).innerText = playerName;

    }


    // ==========================
    // PLAYER POSITION
    // ==========================

    let playerPosition = 50;


    // ==========================
    // MOVE LEFT
    // ==========================

    function moveLeft() {

        playerPosition -= 5;

        if (playerPosition < 22) {
            playerPosition = 22;
        }

        playerCar.style.left =
            playerPosition + "%";
    }


    // ==========================
    // MOVE RIGHT
    // ==========================

    function moveRight() {

        playerPosition += 5;

        if (playerPosition > 76) {
            playerPosition = 76;
        }

        playerCar.style.left =
            playerPosition + "%";
    }


    // ==========================
    // KEYBOARD CONTROL
    // ==========================

    document.addEventListener(
        "keydown",
        function(event) {

            if (event.key === "ArrowLeft") {
                moveLeft();
            }

            if (event.key === "ArrowRight") {
                moveRight();
            }

        }
    );


    // ==========================
    // START MESSAGE
    // ==========================

    setTimeout(function() {

        document.getElementById(
            "message"
        ).innerText = "RACE! 🏎️💨";

    }, 1500);


</script>

</body>
</html>
