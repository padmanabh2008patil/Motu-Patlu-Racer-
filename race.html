<title>Motu-Patlu Racer — Race</title>
<style>

</style></head><body>
<canvas id="c"></canvas>
<div class="h" id="top"></div><div class="h" id="pos">1 / 4</div><div class="h" id="spd">0 km/h</div><div class="h" id="cd">3</div>
<button class="b" id="bl">◀</button><button class="b" id="br">▶</button><button class="b" id="brk">BRAKE</button><button class="b" id="gas">GAS</button><button class="b" id="bb">⚡</button><button class="t" id="tl">📱 Tilt: ON</button><button class="t" id="iv">↔ Reverse</button><div id="rot">📱<br>फोन आडवा करा<br>Rotate to landscape</div><div id="st"><h1>🏎️ TAP TO START</h1><div>Phone उजवीकडे वाकवा = गाडी उजवीकडे<br>GAS = speed · BRAKE = थांबा</div></div>
<div id="fin"><h1 id="res"></h1><div id="msg"></div><button id="nx"></button></div>
<script src="characters.js"></script>
<script>
const $=id=>document.getElementById(id);
const SEC=GAME_CFG.sections.map(x=>[x.name,x.boss]);
const L=Math.min(75,Math.max(1,+localStorage.getItem("currentLevel")||1)),si=Math.floor((L-1)/15),secName=SEC[si][0],bossName=SEC[si][1],boss=L===(si+1)*15;
const nm=x=>/jhatka|zatka/i.test(x)?"Dr. Zatka":x;const CH=nm(localStorage.getItem("selectedCharacter")||"Motu");
const CHR={"Motu":{c:"#e53935",s:"#e0a070",h:"#222",t:0},"Patlu":{c:"#1e88e5",s:"#e8b080",h:"#4a2c14",t:0},"Dr. Zatka":{c:"#8e24aa",s:"#e8b080",h:"#ddd",t:1},"Ghisatu":{c:"#fb8c00",s:"#c68642",h:"#111",t:0},"Singham":{c:"#1565c0",s:"#d9a066",h:"#795548",t:2},"Don":{c:"#212121",s:"#e0a878",h:"#000",t:3}};for(const k in CHR)CHR[k].n=k;
const TH=[
{sky:["#39a9e7","#cdf1ff"],g:["#5cb04a","#4fa23f"],r:["#6b6b6b","#656565"],k:["#fff","#d33"],h:"#4d9550",s:"tree"},
{sky:["#5b7fa6","#d8e3ee"],g:["#8a8f94","#7d8287"],r:["#444","#3d3d3d"],k:["#fff","#fc0"],h:"#6c7a89",s:"building"},
{sky:["#4a90c8","#e3f1fb"],g:["#4c8a5a","#427d50"],r:["#5f5f66","#59595f"],k:["#fff","#c33"],h:"#7b8794",s:"pine"},
{sky:["#f2a65a","#ffe8b0"],g:["#e6c26e","#dbb560"],r:["#7a6a5a","#736352"],k:["#fff","#b33"],h:"#c9954d",s:"cactus"},
{sky:["#9fb8d0","#f4f8fc"],g:["#f2f6fa","#e4ecf3"],r:["#707a85","#69737e"],k:["#fff","#39c"],h:"#c7d6e6",s:"snowpine"}];
const th=[TH[0],TH[1],TH[3],TH[2],{sky:["#6fae8f","#d6efe0"],g:["#2f7a3a","#2a6e34"],r:["#5a5048","#544a42"],k:["#fff","#c63"],h:"#2d6a3a",s:"pine"}][si];
let sd=L*7919+13;const rnd=()=>(sd=sd*16807%2147483647)/2147483647;
const SL=200,RW=2000,CH_=1000,CD=1/Math.tan(50*Math.PI/180),PZ=CH_*CD,DRAW=130,MAX=SL*34;
const TRACK=1800+si*150+((L-1)%15)*50,TL=TRACK*SL;
const segs=[];let lastY=0;
function add(c,y1,y2){const i=segs.length;segs.push({i,curve:c,y1,y2,sp:[],cars:[],p1:{wz:i*SL,wy:y1},p2:{wz:(i+1)*SL,wy:y2}})}
function road(e,h,l,c,hill){const tot=e+h+l,y0=lastY,y1=y0+hill*SL,ey=k=>y0+(y1-y0)*(-Math.cos(Math.PI*k/tot)/2+.5);
 for(let n=0;n<tot;n++){const cc=n<e?c*(n/e)**2:n<e+h?c:c*(1-(n-e-h)/l)**2;add(cc,ey(n),ey(n+1))}lastY=y1}
road(25,25,25,0,0);
const PR=[{l:[25,40],c:[.8,2.5],h:14,p:.55},{l:[12,25],c:[3,6],h:6,p:.8},{l:[45,80],c:[2,4.5],h:26,p:.7},{l:[20,40],c:[1.5,4],h:60,p:.6},{l:[15,35],c:[3,6],h:36,p:.8}][si];
const diff=.6+((L-1)%15)/25;
while(segs.length<TRACK){const n=PR.l[0]+(rnd()*(PR.l[1]-PR.l[0])|0),c=(rnd()<.5?-1:1)*(PR.c[0]+rnd()*(PR.c[1]-PR.c[0]))*diff,hl=(rnd()-.5)*PR.h;road(n,n,n,rnd()<PR.p?c:0,rnd()<.6?hl:0)}
for(let i=0;i<220;i++)add(0,lastY,lastY);
for(let i=15;i<TRACK+100;i+=3+(rnd()*5|0)){segs[i].sp.push({t:th.s,off:(rnd()<.5?-1:1)*(1.3+rnd()*2.5),s:.8+rnd()*.6,c:rnd()*4|0})}
for(let i=80;i<TRACK-40;i+=Math.max(10,26-si*2)+(rnd()*20|0))segs[i].sp.push({t:rnd()<.5?"rock":"barrier",off:rnd()*1.5-.75,hit:0});

// state

const nms=Object.keys(CHR).filter(n=>n!==CH&&n!==bossName),opp=[];
if(boss)opp.push({z:PZ+300,x:.5,k:.9+si*.01,ch:CHR[bossName]});
else[[-.55,300],[.55,300],[0,750]].forEach((a,i)=>opp.push({z:PZ+a[1],x:a[0],k:.74+si*.02+((L-1)%15)*.004+rnd()*.05,ch:CHR[nms[(L+i)%nms.length]]}));
opp.forEach((o,i)=>{o.speed=0;o.tx=o.x;o.id=i});
$("top").textContent=secName.toUpperCase()+"  LEVEL "+L+(boss?" — BOSS: "+bossName:"");
// input
const bind=(id,a,b)=>{const e=$(id);e.addEventListener("pointerdown",v=>{v.preventDefault();a()});["pointerup","pointercancel","pointerleave"].forEach(n=>e.addEventListener(n,b))};
bind("bl",()=>kL=1,()=>kL=0);bind("br",()=>kR=1,()=>kR=0);bind("bb",boost,()=>{});bind("gas",()=>gas=1,()=>gas=0);bind("brk",()=>brk=1,()=>brk=0);
function boost(){if(go&&!done&&boostT<=0&&cool<=0){boostT=2.5;cool=4}}
addEventListener("keydown",e=>{if(e.key==="ArrowLeft"||e.key==="a")kL=1;if(e.key==="ArrowRight"||e.key==="d")kR=1;if(e.key==="ArrowUp"||e.key==="w")gas=1;if(e.key==="ArrowDown"||e.key==="s")brk=1;if(e.code==="Space"){e.preventDefault();boost()}});
addEventListener("keyup",e=>{if(e.key==="ArrowUp"||e.key==="w")gas=0;if(e.key==="ArrowDown"||e.key==="s")brk=0;if(e.key==="ArrowLeft"||e.key==="a")kL=0;if(e.key==="ArrowRight"||e.key==="d")kR=0});
// countdown
function startCD(){$("cd").style.display="block";$("cd").textContent=3;let n=3;const iv=setInterval(()=>{n--;if(n>0)$("cd").textContent=n;else{$("cd").textContent="GO!";go=1;neutral=raw;if(!got&&tilt)$("tl").click();clearInterval(iv);setTimeout(()=>$("cd").style.display="none",600)}},1000)}
$("st").onclick=async()=>{$("st").style.display="none";try{if(DeviceMotionEvent.requestPermission)await DeviceMotionEvent.requestPermission()}catch(e){}
 try{await document.documentElement.requestFullscreen();await screen.orientation.lock("landscape")}catch(e){}
 addEventListener("devicemotion",ev=>{const g=ev.accelerationIncludingGravity;if(!g||g.y==null)return;got=1;const a=(screen.orientation&&screen.orientation.angle)||0;raw=(a===270||a===-90?-g.y:g.y)/9.8});startCD()};
$("tl").onclick=()=>{tilt=!tilt;neutral=raw;$("tl").textContent="📱 Tilt: "+(tilt?"ON":"OFF");$("bl").style.display=$("br").style.display=tilt?"none":"block"};
$("iv").onclick=()=>{inv=!inv};
function update(dt){
 const pz=pos+PZ,seg=segAt(pz),sp=speed/MAX;t+=dt;if(shake>0)shake-=dt;
 if(go&&!done){
  if(boostT>0)boostT-=dt;else if(cool>0)cool-=dt;
  const top=MAX*(boostT>0?1.3:1);
  if(brk)speed-=MAX*1.1*dt;else if(gas||boostT>0)speed+=(speed<top?MAX*.28:-MAX*.4)*dt;else speed-=MAX*.14*dt;
  speed=Math.max(0,speed);const tv=tilt?(raw-neutral)*(inv?-1:1)/.45:0,st=Math.max(-1,Math.min(1,kR-kL+(Math.abs(tv)<.1?0:tv)));
  const d=dt*1.8*Math.max(.3,sp);px+=st*d;px-=d*sp*seg.curve*.3;
  if(Math.abs(px)>1.05&&speed>MAX*.3)speed-=MAX*.9*dt;
  px=Math.max(-2.3,Math.min(2.3,px));
  for(const s of seg.sp)if(s.hit===0&&Math.abs(px-s.off)<.28){s.hit=1;speed*=.3;boostT=0;shake=.4}
 }else if(done)speed=Math.max(0,speed-MAX*.5*dt);
 pos+=speed*dt;skyOff+=seg.curve*sp*dt*80;
 if(go){const all=[{z:pz,x:px,speed},...opp];
  for(const o of opp){const tg=MAX*o.k*(1+.04*Math.sin(t*.7+o.id*2));let bl=null;
   for(const q of all)if(q!==o&&q.z>o.z&&q.z-o.z<800&&Math.abs(q.x-o.x)<.42){bl=q;break}
   if(bl)o.tx=Math.max(-.8,Math.min(.8,bl.x+(o.x>=bl.x?.6:-.6)));
   const st=bl&&bl.z-o.z<350?Math.min(tg,bl.speed):tg;
   o.speed+=(st-o.speed)*Math.min(1,dt*1.5);
   o.x+=Math.sign(o.tx-o.x)*Math.min(Math.abs(o.tx-o.x),.9*dt);o.z+=o.speed*dt;
   const dz=o.z-pz;if(!done&&Math.abs(dz)<260&&Math.abs(o.x-px)<.3){if(dz>0)speed=Math.min(speed,o.speed*.9);px+=(px>=o.x?1:-1)*dt*1.4;shake=.15}}
 }
 if(!done){rank=1+opp.filter(o=>o.z>pz).length;
  if(pz>=TL)finish(1);else if(opp.some(o=>o.z>=TL))finish(0)}
 $("pos").textContent=rank+" / "+(opp.length+1);$("spd").textContent=Math.round(speed/MAX*80)+" km/h";
}
function finish(win){done=1;$("fin").style.display="flex";const nx=$("nx");
 if(win){$("res").textContent="🏆 YOU WIN!";
  if(boss){$("msg").textContent="🎉 You defeated "+bossName+"! Next section unlocked.";localStorage.setItem(bossName+"_unlocked","true");if(bossName==="Dr. Zatka")localStorage.setItem("Dr. Jhatka_unlocked","true");localStorage.setItem(secName+"_completed","true");localStorage.setItem("completedBoss",bossName)}
  else{$("msg").textContent="🏁 Level "+L+" completed!";localStorage.setItem("completedLevel",String(L))}
  localStorage.setItem("highestLevel",String(Math.max(+localStorage.getItem("highestLevel")||1,L+1)));
  nx.textContent="▶ NEXT LEVEL";nx.onclick=()=>{
   if(boss){if(si<4){localStorage.setItem("selectedSection",SEC[si+1][0]);localStorage.setItem("currentLevel",String(L+1))}location.href="sections.html"}
   else{localStorage.setItem("currentLevel",String(L+1));location.href="race.html"}};
 }else{$("res").textContent="❌ YOU LOST!";$("msg").textContent=boss?"Defeat "+bossName+" in the one-to-one race.":"Try again and stay ahead!";nx.textContent="🔄 RETRY";nx.onclick=()=>location.reload()}}
// render
const cv=$("c"),ctx=cv.getContext("2d");let W,H;
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}addEventListener("resize",rs);rs();
const lp=(a,b,p)=>a+(b-a)*p;
function pr(p,cx,cy,cz){const z=p.wz-cz,s=CD/z;p.z=z;p.sc=s;p.sx=Math.round(W/2+s*(-cx)*W/2);p.sy=Math.round(H/2-s*(p.wy-cy)*H/2);p.sw=Math.round(s*RW*W/2)}
function poly(c,...a){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(a[0],a[1]);for(let i=2;i<a.length;i+=2)ctx.lineTo(a[i],a[i+1]);ctx.fill()}
const circ=(x,y,r)=>{ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()};
function car(x,y,w,ch,br){const h=w*.62,c=ch.c,hx=x,hy=y-h*1.0,r=w*.15;
 ctx.fillStyle="rgba(0,0,0,.35)";ctx.beginPath();ctx.ellipse(x,y,w*.6,h*.12,0,0,7);ctx.fill();
 ctx.fillStyle="#151515";ctx.fillRect(x-w*.55,y-h*.5,w*.22,h*.5);ctx.fillRect(x+w*.33,y-h*.5,w*.22,h*.5);
 ctx.fillStyle="#999";ctx.fillRect(x-w*.5,y-h*.3,w*.1,h*.1);ctx.fillRect(x+w*.4,y-h*.3,w*.1,h*.1);
 ctx.strokeStyle="#222";ctx.lineWidth=Math.max(2,w*.03);ctx.beginPath();ctx.moveTo(x-w*.36,y-h*.55);ctx.lineTo(x-w*.3,y-h*1.5);ctx.lineTo(x+w*.3,y-h*1.5);ctx.lineTo(x+w*.36,y-h*.55);ctx.stroke();
 drawChar(ctx,ch.n,hx,hy,r*1.1,1);ctx.fillStyle=c;ctx.fillRect(x-w*.38,y-h*.55,w*.76,h*.38);
 ctx.fillStyle="rgba(0,0,0,.25)";ctx.fillRect(x-w*.38,y-h*.2,w*.76,h*.06);
  ctx.fillStyle=br?"#ff2a2a":"#a00";ctx.fillRect(x-w*.36,y-h*.48,w*.14,h*.1);ctx.fillRect(x+w*.22,y-h*.48,w*.14,h*.1);
 ctx.fillStyle="#222";ctx.fillRect(x-w*.3,y-h*.2,w*.6,h*.07);ctx.fillStyle="#bbb";ctx.fillRect(x-w*.2,y-h*.14,w*.07,h*.1);ctx.fillRect(x+w*.13,y-h*.14,w*.07,h*.1)}
const BC=["#c0634a","#6b8fb5","#d9b45a","#8a8f94"];
function spr(p,x,y,u){const k=p.s||1;let h,w;
 if(p.t==="tree"){h=u*1800*k;ctx.fillStyle="#6b4a2b";ctx.fillRect(x-h*.04,y-h*.35,h*.08,h*.35);ctx.fillStyle="#2f8f3a";circ(x,y-h*.55,h*.26);ctx.fillStyle="#3aa646";circ(x-h*.1,y-h*.65,h*.2)}
 else if(p.t==="building"){w=u*1500*k;h=u*(2800+p.c*500)*k;ctx.fillStyle=BC[p.c];ctx.fillRect(x-w/2,y-h,w,h);ctx.fillStyle="#ffeaa0";for(let i=0;i<3;i++)for(let j=0;j<5;j++)ctx.fillRect(x-w/2+w*(.12+i*.3),y-h*(.92-j*.17),w*.18,h*.09)}
 else if(p.t==="pine"||p.t==="snowpine"){h=u*2400*k;w=h*.4;ctx.fillStyle="#5a3d22";ctx.fillRect(x-w*.06,y-h*.15,w*.12,h*.15);
  for(let i=0;i<3;i++){const ww=w*(1-i*.25),by=y-h*(.12+i*.22);poly(p.t==="pine"?"#2f6b3f":"#cfe0ee",x-ww/2,by,x+ww/2,by,x,by-h*.4)}}
 else if(p.t==="cactus"){h=u*1600*k;ctx.fillStyle="#3c8c3c";ctx.fillRect(x-h*.06,y-h,h*.12,h);ctx.fillRect(x-h*.25,y-h*.6,h*.2,h*.07);ctx.fillRect(x-h*.25,y-h*.75,h*.07,h*.2);ctx.fillRect(x+h*.05,y-h*.45,h*.2,h*.07);ctx.fillRect(x+h*.18,y-h*.6,h*.07,h*.22)}
 else if(p.t==="rock"){ctx.fillStyle="#777";ctx.beginPath();ctx.ellipse(x,y-u*120,u*300,u*220,0,0,7);ctx.fill()}
 else if(p.t==="barrier"){w=u*900;h=u*320;for(let i=0;i<6;i++){ctx.fillStyle=i%2?"#fff":"#d32";ctx.fillRect(x-w/2+i*w/6,y-h,w/6,h*.6)}ctx.fillStyle="#555";ctx.fillRect(x-w*.45,y-h*.4,w*.06,h*.4);ctx.fillRect(x+w*.39,y-h*.4,w*.06,h*.4)}}
function bg(){const g=ctx.createLinearGradient(0,0,0,H/2);g.addColorStop(0,th.sky[0]);g.addColorStop(1,th.sky[1]);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.fillStyle="rgba(255,240,150,.9)";circ(W*.8,H*.17,H*.07);
 ctx.fillStyle=th.h;ctx.beginPath();ctx.moveTo(0,H/2+2);for(let x=0;x<=W;x+=14){const u=(x+skyOff)/W*6.28;ctx.lineTo(x,H/2-H*.09*(1+Math.sin(u*1.3)*.5+Math.sin(u*3.1+1)*.3))}ctx.lineTo(W,H/2+2);ctx.fill();
 ctx.fillStyle=th.g[0];ctx.fillRect(0,H/2,W,H/2)}
let fr=0;
function render(){fr++;ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*8,(Math.random()-.5)*8);bg();
 const base=segAt(pos),bp=(pos%SL)/SL,ps=segAt(pos+PZ),pp=((pos+PZ)%SL)/SL,camY=CH_+lp(ps.y1,ps.y2,pp),n0=base.i;
 let maxy=H,x=0,dx=-base.curve*bp;
 for(let n=0;n<DRAW;n++){const s=segs[n0+n];if(!s)break;
  pr(s.p1,px*RW-x,camY,pos);pr(s.p2,px*RW-x-dx,camY,pos);x+=dx;dx+=s.curve;
  if(s.p1.z<=CD||s.p2.sy>=s.p1.sy||s.p2.sy>=maxy)continue;
  s.fr=fr;s.clip=maxy;const a=s.p1,b=s.p2,dk=Math.floor(s.i/3)%2,fin=(s.i>=TRACK&&s.i<TRACK+2)||s.i===12;
  ctx.fillStyle=th.g[dk];ctx.fillRect(0,b.sy,W,a.sy-b.sy);
  const r1=a.sw/6,r2=b.sw/6,rk=th.k[dk];

  poly(rk,a.sx+a.sw+r1,a.sy,a.sx+a.sw,a.sy,b.sx+b.sw,b.sy,b.sx+b.sw+r2,b.sy);
  poly(fin?(s.i%2?"#fff":"#111"):th.r[dk],a.sx-a.sw,a.sy,a.sx+a.sw,a.sy,b.sx+b.sw,b.sy,b.sx-b.sw,b.sy);
  if(!dk&&!fin)for(let k=1;k<3;k++){const c1=a.sx-a.sw+a.sw*2*k/3,c2=b.sx-b.sw+b.sw*2*k/3,l1=a.sw/18,l2=b.sw/18;poly("#fff",c1-l1,a.sy,c1+l1,a.sy,c2+l2,b.sy,c2-l2,b.sy)}
  maxy=a.sy}
 for(let n=0;n<DRAW;n++){const s=segs[n0+n];if(s)s.cars.length=0}
 for(const o of opp){const i=Math.floor(o.z/SL);if(i>=n0&&i<n0+DRAW)segs[i].cars.push(o)}
