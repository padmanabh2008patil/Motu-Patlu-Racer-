<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Motu-Patlu Racer - Race</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    text-align: center;
    overflow: hidden;
}

.top-bar {
    height: 90px;
    background: linear-gradient(
        135deg,
        #ff9800,
        #e65100
    );

    display: flex;
    align-items: center;
    justify-content: space-around;

    padding: 8px;
}

.top-bar h2 {
    margin: 0;
    font-size: 20px;
}

.top-bar p {
    margin: 5px 0;
    font-size: 14px;
}


/* =========================
   RACE AREA
========================= */

.race-area {

    position: relative;

    width: 100%;
    height: calc(100vh - 170px);

    min-height: 500px;

    overflow: hidden;

    background:
        linear-gradient(
            to right,
            #388e3c 0%,
            #388e3c 18%,
            #444 18%,
            #444 82%,
            #388e3c 82%,
            #388e3c 100%
        );
}


/* ROAD */

.road {

    position: absolute;

    left: 18%;
    right: 18%;

    top: 0;
    bottom: 0;

    background: #444;

    border-left: 6px solid white;
    border-right: 6px solid white;
}


/* ROAD LINES */

.road-line {

    position: absolute;

    width: 8px;
    height: 70px;

    background: white;

    left: 50%;

    transform: translateX(-50%);
}


/* PLAYER */

.player {

    position: absolute;

    bottom: 30px;

    left: 50%;

    transform: translateX(-50%);

    font-size: 55px;

    z-index: 10;

    transition: left 0.08s linear;
}


/* AI RACERS */

.ai {

    position: absolute;

    font-size: 48px;

    z-index: 5;
}


/* COUNTDOWN */

.countdown {

    position: absolute;

    top: 40%;
    left: 50%;

    transform: translate(
        -50%,
        -50%
    );

    font-size: 80px;

    font-weight: bold;

    color: #ffd700;

    text-shadow:
        3px 3px 10px black;

    z-index: 50;
}


/* RESULT */

.result-box {

    display: none;

    position: fixed;

    top: 50%;
    left: 50%;

    transform:
        translate(-50%, -50%);

    width: 85%;
    max-width: 400px;

    padding: 30px;

    background: rgba(
        0,
        0,
        0,
        0.95
    );

    border: 3px solid #ff9800;

    border-radius: 20px;

    z-index: 100;
}

.result-box h1 {
    margin-top: 0;
}

.result-box button {

    margin: 7px;

    padding: 12px 22px;

    border: none;

    border-radius: 10px;

    background: #ff9800;

    color: white;

    font-size: 16px;

    font-weight: bold;
}


/* CONTROLS */

.controls {

    position: fixed;

    bottom: 15px;

    left: 0;
    right: 0;

    display: flex;

    justify-content:
        space-evenly;

    z-index: 80;
}

.controls button {

    width: 80px;
    height: 55px;

    border: none;

    border-radius: 15px;

    background: #ff9800;

    color: white;

    font-size: 25px;

    font-weight: bold;
}

.controls button:active {

    background: #e65100;

    transform: scale(0.95);
}


/* MOBILE */

@media (max-width: 600px) {

    .top-bar {
        height: 85px;
    }

    .top-bar h2 {
        font-size: 16px;
    }

    .top-bar p {
        font-size: 12px;
    }

    .player {
        font-size: 48px;
    }

    .ai {
        font-size: 40px;
    }

    .countdown {
        font-size: 65px;
    }

}

</style>

</head>


<body>


<!-- =========================
     TOP INFORMATION
========================= -->

<div class="top-bar">

    <div>

        <h2 id="sectionName">
            Village
        </h2>

        <p id="levelText">
            Level 1
        </p>

    </div>


    <div>

        <h2 id="playerName">
            Motu
        </h2>

        <p>
            🏎️ PLAYER
        </p>

    </div>


    <div>

        <h2 id="bossName">
            Race
        </h2>

        <p id="raceType">
            Normal Race
        </p>

    </div>

</div>


<!-- =========================
     RACE AREA
========================= -->

<div class="race-area">

    <div class="road"></div>


    <!-- ROAD LINES -->

    <div
        class="road-line"
        style="top: 0;">
    </div>

    <div
        class="road-line"
        style="top: 140px;">
    </div>

    <div
        class="road-line"
        style="top: 280px;">
    </div>

    <div
        class="road-line"
        style="top: 420px;">
    </div>


    <!-- PLAYER CAR -->

    <div
        id="playerCar"
        class="player">

        🏎️

    </div>


    <!-- AI CARS -->

    <div
        id="ai1"
        class="ai"
        style="
        top: 40px;
        left: 30%;">

        🚗

    </div>


    <div
        id="ai2"
        class="ai"
        style="
        top: 160px;
        left: 55%;">

        🚙

    </div>


    <div
        id="ai3"
        class="ai"
        style="
        top: 280px;
        left: 40%;">

        🚓

    </div>


    <div
        id="ai4"
        class="ai"
        style="
        top: 100px;
        left: 65%;">

        🏁

    </div>


    <!-- COUNTDOWN -->

    <div
        id="countdown"
        class="countdown">

        3

    </div>

</div>


<!-- =========================
     CONTROLS
========================= -->

<div class="controls">

    <button
        onclick="moveLeft()">

        ◀

    </button>


    <button
        onclick="moveRight()">

        ▶

    </button>

</div>


<!-- =========================
     RESULT BOX
========================= -->

<div
    id="resultBox"
    class="result-box">

    <h1 id="resultTitle">
        🏆 YOU WIN!
    </h1>

    <p id="resultMessage">
        Race completed!
    </p>


    <button
        onclick="nextLevel()">

        ▶ NEXT LEVEL

    </button>


    <button
        onclick="goLevels()">

        📋 LEVELS

    </button>

</div>


<script>

/* =========================
   GAME DATA
========================= */

const sections = {

    Village: {
        start: 1,
        end: 15,
        boss: "Patlu"
    },

    City: {
        start: 16,
        end: 30,
        boss: "Dr. Jhatka"
    },

    Mountain: {
        start: 31,
        end: 45,
        boss: "Ghisatu"
    },

    Desert: {
        start: 46,
        end: 60,
        boss: "Inspector Chingam"
    },

    "Snow Valley": {
        start: 61,
        end: 75,
        boss: "John"
    }

};


/* =========================
   LOAD GAME DATA
========================= */

const currentLevel =
    parseInt(
        localStorage.getItem(
            "currentLevel"
        )
    ) || 1;


const selectedCharacter =
    localStorage.getItem(
        "selectedCharacter"
    ) || "Motu";


const selectedSection =
    localStorage.getItem(
        "selectedSection"
    ) || "Village";


const section =
    sections[selectedSection];


/* =========================
   CHECK BOSS LEVEL
========================= */

const isBossLevel =
    currentLevel === section.end;


const bossCharacter =
    section.boss;


/* =========================
   DISPLAY INFORMATION
========================= */

document.getElementById(
    "sectionName"
).innerText =
    selectedSection;


document.getElementById(
    "levelText"
).innerText =
    "Level " + currentLevel;


document.getElementById(
    "playerName"
).innerText =
    selectedCharacter;


if (isBossLevel) {

    document.getElementById(
        "bossName"
    ).innerText =
        "VS " + bossCharacter;

    document.getElementById(
        "raceType"
    ).innerText =
        "🏆 BOSS RACE";

} else {

    document.getElementById(
        "bossName"
    ).innerText =
        "Race";

    document.getElementById(
        "raceType"
    ).innerText =
        "Normal Race";

}
    /* =========================
   RACE VARIABLES
========================= */

const playerCar =
    document.getElementById("playerCar");

const ai1 =
    document.getElementById("ai1");

const ai2 =
    document.getElementById("ai2");

const ai3 =
    document.getElementById("ai3");

const ai4 =
    document.getElementById("ai4");

const countdown =
    document.getElementById("countdown");


let playerPosition = 50;

let playerProgress = 0;

let opponentProgress = 0;

let raceStarted = false;

let raceFinished = false;


/* =========================
   BOSS / NORMAL RACERS
========================= */

if (isBossLevel) {

    /*
    Boss race = only 1 opponent
    */

    ai1.innerHTML = getCharacterEmoji(
        bossCharacter
    );

    ai1.style.left = "50%";

    ai2.style.display = "none";
    ai3.style.display = "none";
    ai4.style.display = "none";

} else {

    /*
    Normal race
    */

    ai1.innerHTML = "🚗";
    ai2.innerHTML = "🚙";
    ai3.innerHTML = "🚓";
    ai4.innerHTML = "🏁";

}


/* =========================
   CHARACTER EMOJI
========================= */

function getCharacterEmoji(name) {

    const emojis = {

        "Motu": "🏎️",

        "Patlu": "🚗",

        "Dr. Jhatka": "🚙",

        "Ghisatu": "🏁",

        "Inspector Chingam": "🚓",

        "John": "🏎️"

    };

    return emojis[name] || "🚗";

}


/* =========================
   PLAYER CAR
========================= */

playerCar.innerHTML =
    getCharacterEmoji(
        selectedCharacter
    );


/* =========================
   MOVE LEFT
========================= */

function moveLeft() {

    if (!raceStarted ||
        raceFinished) {
        return;
    }

    playerPosition -= 5;

    if (playerPosition < 22) {
        playerPosition = 22;
    }

    playerCar.style.left =
        playerPosition + "%";

}


/* =========================
   MOVE RIGHT
========================= */

function moveRight() {

    if (!raceStarted ||
        raceFinished) {
        return;
    }

    playerPosition += 5;

    if (playerPosition > 78) {
        playerPosition = 78;
    }

    playerCar.style.left =
        playerPosition + "%";

}


/* =========================
   KEYBOARD CONTROLS
========================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "ArrowLeft") {

            moveLeft();

        }

        if (event.key === "ArrowRight") {

            moveRight();

        }

    }
);


/* =========================
   COUNTDOWN
========================= */

let count = 3;


const countdownTimer =
    setInterval(function() {

        count--;

        if (count === 2) {

            countdown.innerText =
                "2";

        }

        else if (count === 1) {

            countdown.innerText =
                "1";

        }

        else if (count === 0) {

            countdown.innerText =
                "GO!";

            raceStarted = true;

            startRace();

            setTimeout(
                function() {

                    countdown.style.display =
                        "none";

                },
                700
            );

            clearInterval(
                countdownTimer
            );

        }

    }, 1000);


/* =========================
   START RACE
========================= */

function startRace() {

    const raceTimer =
        setInterval(
            function() {

                if (raceFinished) {

                    clearInterval(
                        raceTimer
                    );

                    return;
                }


                /*
                Player progress
                */

                playerProgress +=
                    Math.random() * 2.5 + 1;


                /*
                Opponent speed
                */

                if (isBossLevel) {

                    /*
                    Boss is stronger
                    */

                    opponentProgress +=
                        Math.random() * 2.2 + 1.5;

                } else {

                    opponentProgress +=
                        Math.random() * 2 + 1;

                }


                /*
                Move AI cars
                */

                moveAI(
                    ai1,
                    opponentProgress
                );


                if (!isBossLevel) {

                    moveAI(
                        ai2,
                        opponentProgress * 0.92
                    );

                    moveAI(
                        ai3,
                        opponentProgress * 0.88
                    );

                    moveAI(
                        ai4,
                        opponentProgress * 0.95
                    );

                }


                /*
                Check winner
                */

                if (playerProgress >= 100) {

                    finishRace(true);

                    clearInterval(
                        raceTimer
                    );

                }

                else if (
                    opponentProgress >= 100
                ) {

                    finishRace(false);

                    clearInterval(
                        raceTimer
                    );

                }

            },
            100
        );

}


/* =========================
   MOVE AI
========================= */

function moveAI(car, progress) {

    const roadHeight =
        window.innerHeight;

    let topPosition =
        40 + progress * 5;

    if (
        topPosition >
        roadHeight - 100
    ) {

        topPosition =
            40;

    }

    car.style.top =
        topPosition + "px";

}


/* =========================
   FINISH RACE
========================= */

function finishRace(playerWon) {

    raceFinished = true;

    const resultBox =
        document.getElementById(
            "resultBox"
        );

    const resultTitle =
        document.getElementById(
            "resultTitle"
        );

    const resultMessage =
        document.getElementById(
            "resultMessage"
        );


    resultBox.style.display =
        "block";


    if (playerWon) {

        resultTitle.innerText =
            "🏆 YOU WIN!";

        if (isBossLevel) {

            resultMessage.innerText =
                "🎉 You defeated " +
                bossCharacter +
                "!";

            completeBossLevel();

        } else {

            resultMessage.innerText =
                "🏁 Level " +
                currentLevel +
                " completed!";

            completeNormalLevel();

        }

    } else {

        resultTitle.innerText =
            "❌ YOU LOST!";

        if (isBossLevel) {

            resultMessage.innerText =
                "You must defeat " +
                bossCharacter +
                " to unlock the next Section.";

        } else {

            resultMessage.innerText =
                "Try the race again!";

        }

    }

}


/* =========================
   NORMAL LEVEL COMPLETE
========================= */

function completeNormalLevel() {

    let highestLevel =
        parseInt(
            localStorage.getItem(
                "highestLevel"
            )
        ) || 1;


    if (
        currentLevel + 1 >
        highestLevel
    ) {

        localStorage.setItem(
            "highestLevel",
            currentLevel + 1
        );

    }

    localStorage.setItem(
        "completedLevel",
        currentLevel
    );

}


/* =========================
   BOSS LEVEL COMPLETE
========================= */

function completeBossLevel() {

    let highestLevel =
        parseInt(
            localStorage.getItem(
                "highestLevel"
            )
        ) || 1;


    /*
    Unlock the next level
    */

    if (
        currentLevel + 1 >
        highestLevel
    ) {

        localStorage.setItem(
            "highestLevel",
            currentLevel + 1
        );

    }


    /*
    Unlock defeated character
    */

    localStorage.setItem(
        bossCharacter +
        "_unlocked",
        "true"
    );


    localStorage.setItem(
        "completedBoss",
        bossCharacter
    );


    /*
    Mark section complete
    */

    localStorage.setItem(
        selectedSection +
        "_completed",
        "true"
    );

    }
    /* =========================
   NEXT LEVEL
========================= */

function nextLevel() {

    /*
    Boss level completed
    */

    if (isBossLevel) {

        /*
        After Boss:
        Go to next section
        */

        const nextSection =
            getNextSection();

        if (nextSection) {

            localStorage.setItem(
                "selectedSection",
                nextSection
            );

            localStorage.setItem(
                "currentLevel",
                sections[nextSection].start
            );

            window.location.href =
                "levels.html";

            return;

        }

    }


    /*
    Normal level:
    Go to next level
    */

    const nextLevelNumber =
        currentLevel + 1;


    if (
        nextLevelNumber <=
        section.end
    ) {

        localStorage.setItem(
            "currentLevel",
            nextLevelNumber
        );

        window.location.href =
            "race.html";

    } else {

        window.location.href =
            "levels.html";

    }

}


/* =========================
   GET NEXT SECTION
========================= */

function getNextSection() {

    const sectionNames = [
        "Village",
        "City",
        "Mountain",
        "Desert",
        "Snow Valley"
    ];


    const currentIndex =
        sectionNames.indexOf(
            selectedSection
        );


    if (
        currentIndex === -1 ||
        currentIndex >=
        sectionNames.length - 1
    ) {

        return null;

    }


    return sectionNames[
        currentIndex + 1
    ];

}


/* =========================
   GO TO LEVELS
========================= */

function goLevels() {

    window.location.href =
        "levels.html";

}


/* =========================
   PAGE START
========================= */

console.log(
    "🏎️ Race Started"
);

console.log(
    "Section:",
    selectedSection
);

console.log(
    "Level:",
    currentLevel
);

console.log(
    "Player:",
    selectedCharacter
);

console.log(
    "Boss:",
    isBossLevel
        ? bossCharacter
        : "None"
);

</script>

</body>

</html>
